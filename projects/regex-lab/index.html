<link rel="icon" href="../../favicon.svg" />
<meta name="theme-color" content="#06070d" />
<title>Regex Lab</title>
<meta name="description" content="A regular expression engine you can watch think: pattern to NFA to match trace, with the backtracker racing the parallel simulator." />
<link rel="stylesheet" href="../../shared/lab.css" />
<style>
  .shell { grid-template-rows: auto auto 1fr auto; }

  .compose {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 10px;
    padding: 10px 12px 0;
  }
  .compose .slot { position: relative; }
  .compose .lab {
    position: absolute; top: 8px; left: 10px;
    font: 500 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--fg-ghost); pointer-events: none;
  }
  .compose input {
    font-size: 15px; padding: 22px 10px 9px;
    background: var(--ink-800);
  }
  .compose input.bad { border-color: var(--bad); }
  .err {
    font: 400 11px/1.4 var(--mono); color: var(--bad);
    padding: 5px 2px 0;
  }
  .err .caret { color: var(--fg-ghost); white-space: pre; }

  .presets { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px 0; align-items: center; }
  .presets button { font: 400 11px/1 var(--mono); padding: 5px 8px; }

  main {
    display: grid;
    grid-template-columns: 268px minmax(0, 1fr) 320px;
    gap: 10px;
    padding: 10px 12px;
    min-height: 0;
  }
  @media (max-width: 1180px) {
    main { grid-template-columns: 240px minmax(0,1fr); }
    main > .third { display: none; }
  }

  /* ── the tape ─────────────────────────────────────────────── */
  .tape { display: flex; gap: 2px; padding: 10px; flex-wrap: wrap; align-items: flex-end; }
  .cell {
    position: relative;
    min-width: 24px; height: 34px;
    display: grid; place-items: center;
    font: 500 14px/1 var(--mono);
    background: var(--ink-750);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    color: var(--fg-dim);
    cursor: pointer;
  }
  .cell.done { background: color-mix(in oklab, var(--accent) 12%, var(--ink-750)); color: var(--fg); border-color: var(--accent-deep); }
  .cell.cursor { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); color: var(--accent); }
  .cell.dead { border-color: var(--bad); color: var(--bad); }
  .cell i {
    position: absolute; bottom: -14px; left: 0; right: 0;
    text-align: center; font: 400 9px/1 var(--mono); color: var(--fg-ghost); font-style: normal;
  }
  .caretend {
    width: 3px; height: 34px; border-radius: 2px; background: var(--fg-ghost);
  }
  .caretend.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .transport { display: flex; align-items: center; gap: 6px; padding: 0 10px 10px; }
  .transport .grow { flex: 1; }

  canvas.graph { width: 100%; height: 100%; display: block; cursor: grab; }
  .wrap-graph { position: relative; flex: 1; min-height: 0; }
  .tip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--ink-750); border: 1px solid var(--line-bright); border-radius: var(--r-sm);
    padding: 6px 8px; font: 400 11px/1.5 var(--mono); color: var(--fg-dim);
    box-shadow: var(--shadow); max-width: 240px; display: none;
  }

  /* ── AST tree ─────────────────────────────────────────────── */
  .ast { font: 400 11.5px/1.7 var(--mono); }
  .ast .row { display: flex; gap: 6px; white-space: nowrap; border-radius: 3px; padding: 0 3px; cursor: default; }
  .ast .row:hover { background: var(--ink-750); }
  .ast .row.hi { background: color-mix(in oklab, var(--accent) 16%, transparent); }
  .ast .t { color: var(--accent); }
  .ast .v { color: var(--fg); }
  .ast .g { color: var(--fg-ghost); }

  /* ── engine race ──────────────────────────────────────────── */
  .race { padding: 2px 0 6px; }
  .race .row { margin-bottom: 9px; }
  .race .top { display: flex; justify-content: space-between; align-items: baseline; font: 500 10.5px/1.6 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--fg-mute); }
  .race .top b { font: 500 12px/1 var(--mono); color: var(--fg); text-transform: none; letter-spacing: 0; }
  .race .bar { height: 6px; border-radius: 3px; background: var(--ink-700); overflow: hidden; }
  .race .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width .35s ease; }
  .race .bar.danger > i { background: var(--bad); }
  .race .note { font: 400 10.5px/1.45 var(--sans); color: var(--fg-mute); margin-top: 4px; }

  .verdict { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .verdict .big { font: 600 13px/1 var(--sans); }

  /* ── trace ─────────────────────────────────────────────────── */
  .trace { font: 400 11px/1.6 var(--mono); }
  .trace .r { display: flex; gap: 6px; padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
  .trace .r:hover { background: var(--ink-750); }
  .trace .st { color: var(--fg-ghost); width: 40px; text-align: right; flex: none; }
  .trace .act { width: 66px; flex: none; }
  .trace .a-consume { color: var(--ok); }
  .trace .a-fail { color: var(--bad); }
  .trace .a-backtrack { color: var(--warn); }
  .trace .a-try, .trace .a-greedy, .trace .a-lazy { color: var(--viol); }
  .trace .a-assert { color: var(--accent); }
  .trace .src { color: var(--fg-dim); }

  .tabs { display: flex; gap: 2px; }
  .tabs button { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 5px 7px; }

  .dfa td.acc { color: var(--ok); }
  .dfa th:first-child, .dfa td:first-child { position: sticky; left: 0; background: var(--ink-800); }
</style>

<script type="module">
import { h, $, themeToggle, hidpi, css, fmt, clamp, explainer, explainButton } from '../../shared/lab.js';
import { BRIEFINGS } from '../../shared/briefings.js';
import { build, ParseError, pretty } from './engine.js';

themeToggle($('#theme'));

const PRESETS = [
  ['(a|b)*abb', 'aababb', 'classic'],
  ['(a+)+b', 'aaaaaaaaaaaaaaaaaaaaaaaaaaaa', 'catastrophic'],
  ['^\\w+@\\w+\\.[a-z]{2,6}$', 'ada@lovelace.org', 'email-ish'],
  ['(\\d+)\\.(\\d+)\\.(\\d+)', '4.11.2', 'semver'],
  ['a.*?c', 'abcbc', 'lazy vs greedy'],
  ['[^"]*"', 'say "hi"', 'scanner'],
  ['(ab|a)(b?)c', 'abc', 'ambiguity'],
  ['x{2,4}y', 'xxxy', 'bounded'],
];

const state = { pos: 0, result: null, error: null, hoverNode: null, tab: 'trace' };
let playing = null;

/* ── layout ──────────────────────────────────────────────────────────────
   Automata read left to right, so x is a *longest path* layer: a node sits
   one column right of the furthest-along node that can reach it. Loop edges
   (found by DFS) are excluded from the ranking, then drawn bowing backwards
   so a cycle is visible as a cycle.
─────────────────────────────────────────────────────────────────────────── */
function layout(nfa, w, hgt) {
  const n = nfa.states.length;
  const back = new Set();
  const color = new Array(n).fill(0);           // 0 unseen, 1 on stack, 2 done
  (function dfs(s) {
    color[s] = 1;
    for (const tr of nfa.states[s].out) {
      if (color[tr.to] === 1) back.add(s + '>' + tr.to);
      else if (color[tr.to] === 0) dfs(tr.to);
    }
    color[s] = 2;
  })(nfa.start);

  const depth = new Array(n).fill(0);
  for (let pass = 0; pass < n; pass++) {        // relax until stable
    let moved = false;
    for (const st of nfa.states) {
      for (const tr of st.out) {
        if (back.has(st.id + '>' + tr.to)) continue;
        if (depth[tr.to] < depth[st.id] + 1) { depth[tr.to] = depth[st.id] + 1; moved = true; }
      }
    }
    if (!moved) break;
  }
  depth[nfa.accept] = Math.max(...depth);       // the accept state anchors the right edge

  const cols = new Map();
  for (let i = 0; i < n; i++) {
    const d = Number.isFinite(depth[i]) ? depth[i] : 0;
    if (!cols.has(d)) cols.set(d, []);
    cols.get(d).push(i);
  }
  const keys = [...cols.keys()].sort((a, b) => a - b);
  const maxRow = Math.max(...keys.map((k) => cols.get(k).length));
  const padX = 34, padY = 26;
  const stepX = keys.length > 1 ? (w - padX * 2) / (keys.length - 1) : 0;
  const stepY = maxRow > 1 ? Math.min(58, (hgt - padY * 2) / (maxRow - 1)) : 0;
  const pos = new Array(n);
  keys.forEach((k, ci) => {
    const list = cols.get(k);
    list.forEach((id, ri) => {
      pos[id] = {
        x: padX + ci * stepX,
        y: hgt / 2 + (ri - (list.length - 1) / 2) * (stepY || 44),
        col: ci, row: ri, depth: k,
      };
    });
  });
  const r = clamp(Math.min(stepX ? stepX * 0.3 : 14, (stepY || 44) * 0.32), 5.5, 13);
  return { pos, r, back, cols: keys.length };
}

/* ── canvas ─────────────────────────────────────────────────────────────── */
const canvas = $('#graph');
const tip = $('#tip');
let view = { pos: [], r: 12, w: 0, h: 0 };

const fit = hidpi(canvas, (ctx, w, hgt) => { view.w = w; view.h = hgt; draw(); });

function draw() {
  const ctx = canvas.getContext('2d');
  const { w, h: hgt } = view;
  ctx.clearRect(0, 0, w, hgt);
  if (!state.result) return;
  const nfa = state.result.nfa;
  const L = layout(nfa, w, hgt);
  view.pos = L.pos; view.r = L.r;

  const frame = state.result.sim.frames[Math.min(state.pos, state.result.sim.frames.length - 1)];
  const active = new Set(frame ? frame.states : []);
  const takenEdges = new Set((frame?.took || []).map(([a, b]) => a + '>' + b));
  const epsEdges = new Set((frame?.eps || []).map(([a, b]) => a + '>' + b));

  const C = {
    line: css('--line-bright'), dim: css('--fg-ghost'), fg: css('--fg-dim'),
    accent: css('--accent'), ok: css('--ok'), panel: css('--ink-800'), ink: css('--ink-700'),
    viol: css('--viol'), mute: css('--fg-mute'),
  };

  // edges first
  for (const st of nfa.states) {
    for (const tr of st.out) {
      const a = L.pos[st.id], b = L.pos[tr.to];
      if (!a || !b) continue;
      const key = st.id + '>' + tr.to;
      const hot = takenEdges.has(key);
      const warm = epsEdges.has(key);
      const isEps = tr.kind === 'eps';
      ctx.save();
      ctx.strokeStyle = hot ? C.accent : warm ? C.viol : isEps ? C.line : C.fg;
      ctx.globalAlpha = hot ? 1 : warm ? 0.85 : isEps ? 0.5 : 0.75;
      ctx.lineWidth = hot ? 2 : 1;
      if (isEps && !hot && !warm) ctx.setLineDash([2, 3]);
      ctx.beginPath();
      let head = { x: b.x, y: b.y, dx: b.x - a.x, dy: b.y - a.y };
      if (st.id === tr.to) {
        ctx.arc(a.x, a.y - L.r, L.r * 0.8, 0.15 * Math.PI, 0.85 * Math.PI, true);
        head = { x: a.x + L.r * 0.7, y: a.y - L.r * 0.9, dx: 1, dy: 1 };
      } else {
        const isBack = L.back.has(key);
        const mx = (a.x + b.x) / 2;
        const bow = isBack ? -Math.max(26, Math.abs(a.x - b.x) * 0.3) : 0;
        const c1 = { x: mx, y: a.y + bow }, c2 = { x: mx, y: b.y + bow };
        // stop the stroke at the node edge so the arrowhead has room
        const ang = Math.atan2(b.y - c2.y, b.x - c2.x);
        const tipX = b.x - Math.cos(ang) * (L.r + 3.5);
        const tipY = b.y - Math.sin(ang) * (L.r + 3.5);
        ctx.moveTo(a.x, a.y);
        ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, tipX, tipY);
        head = { x: tipX, y: tipY, dx: Math.cos(ang), dy: Math.sin(ang) };
      }
      ctx.stroke();
      ctx.setLineDash([]);
      const ha = Math.atan2(head.dy, head.dx);
      ctx.beginPath();
      ctx.moveTo(head.x, head.y);
      ctx.lineTo(head.x - Math.cos(ha - 0.4) * 6, head.y - Math.sin(ha - 0.4) * 6);
      ctx.lineTo(head.x - Math.cos(ha + 0.4) * 6, head.y - Math.sin(ha + 0.4) * 6);
      ctx.closePath();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fill();
      ctx.restore();

      if (!isEps) {                             // label consuming transitions
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 7;
        const label = tr.label.length > 7 ? tr.label.slice(0, 6) + '…' : tr.label;
        ctx.font = '500 10px ui-monospace, monospace';
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = C.panel;
        ctx.fillRect(mx - tw / 2 - 3, my - 6, tw + 6, 12);
        ctx.fillStyle = hot ? C.accent : C.mute;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, mx, my);
      }
    }
  }

  // nodes
  for (const st of nfa.states) {
    const p = L.pos[st.id];
    if (!p) continue;
    const on = active.has(st.id);
    const isAccept = st.id === nfa.accept;
    ctx.beginPath();
    ctx.arc(p.x, p.y, L.r, 0, Math.PI * 2);
    ctx.fillStyle = on ? (isAccept ? C.ok : C.accent) : C.ink;
    ctx.fill();
    ctx.lineWidth = 1.25;
    ctx.strokeStyle = on ? (isAccept ? C.ok : C.accent) : isAccept ? C.ok : C.line;
    ctx.stroke();
    if (isAccept) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, L.r + 3.5, 0, Math.PI * 2);
      ctx.strokeStyle = on ? C.ok : C.line;
      ctx.stroke();
    }
    if (st.id === nfa.start) {
      ctx.beginPath();
      ctx.moveTo(p.x - L.r - 14, p.y); ctx.lineTo(p.x - L.r - 2, p.y);
      ctx.strokeStyle = C.mute; ctx.setLineDash([]); ctx.stroke();
    }
    if (L.r >= 9) {
      ctx.font = '500 9.5px ui-monospace, monospace';
      ctx.fillStyle = on ? css('--ink-900') : C.mute;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(st.id), p.x, p.y);
    }
  }
}

canvas.addEventListener('mousemove', (e) => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = view.pos.findIndex((p) => p && (p.x - x) ** 2 + (p.y - y) ** 2 < (view.r + 5) ** 2);
  if (hit < 0) { tip.style.display = 'none'; return; }
  const st = state.result.nfa.states[hit];
  const lines = st.out.map((t) => `${t.kind === 'eps' ? 'e' : t.label} -> q${t.to}`);
  tip.innerHTML = `<b style="color:var(--accent)">q${hit}</b>${hit === state.result.nfa.accept ? ' <span class="tag ok">accept</span>' : ''}<br>` +
    (lines.length ? lines.join('<br>') : '<span class="mute">no outgoing edges</span>');
  tip.style.display = 'block';
  tip.style.left = Math.min(x + 14, r.width - 250) + 'px';
  tip.style.top = Math.max(4, y - 10) + 'px';
});
canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

/* ── tape + transport ───────────────────────────────────────────────────── */
function renderTape() {
  const box = $('#tape');
  box.textContent = '';
  const input = $('#inp').value;
  const sim = state.result?.sim;
  const dead = sim?.deadAt;
  [...input].forEach((ch, i) => {
    const cls = ['cell'];
    if (i < state.pos) cls.push('done');
    if (i === state.pos) cls.push('cursor');
    if (dead != null && i >= dead) cls.push('dead');
    box.append(h('div', { class: cls.join(' '), onclick: () => setPos(i) }, ch === ' ' ? '␣' : ch, h('i', {}, i)));
  });
  box.append(h('div', {
    class: 'caretend' + (state.pos >= input.length ? ' on' : ''),
    title: 'end of input',
    onclick: () => setPos(input.length),
  }));
}

function setPos(p) {
  const max = state.result ? state.result.sim.frames.length - 1 : 0;
  state.pos = clamp(p, 0, Math.max(0, max));
  renderTape(); draw(); renderFrameInfo(); renderAst();
}

function renderFrameInfo() {
  const sim = state.result?.sim;
  if (!sim) return;
  const f = sim.frames[Math.min(state.pos, sim.frames.length - 1)];
  $('#frameinfo').textContent = `pos ${f.pos}/${$('#inp').value.length} · ${f.states.length} live state${f.states.length === 1 ? '' : 's'}` +
    (f.accepting ? ' · accepting' : '');
}

function togglePlay() {
  if (playing) { clearInterval(playing); playing = null; $('#play').innerHTML = '&#9205; play'; return; }
  $('#play').innerHTML = '&#9208; pause';
  playing = setInterval(() => {
    const max = state.result ? state.result.sim.frames.length - 1 : 0;
    if (state.pos >= max) { togglePlay(); return; }
    setPos(state.pos + 1);
  }, 420);
}

/* ── panels ─────────────────────────────────────────────────────────────── */
function describe(n) {
  switch (n.t) {
    case 'char': return ['char', JSON.stringify(String.fromCodePoint(n.c))];
    case 'any': return ['any', 'any char but newline'];
    case 'class': return ['class', (n.neg ? 'not ' : '') + n.ranges.map(([a, b]) => (a === b ? pretty(a) : `${pretty(a)}-${pretty(b)}`)).join(' ').slice(0, 28)];
    case 'anchor': return ['assert', n.k === 'b' ? 'word boundary' : n.k === 'B' ? 'non-boundary' : n.k === '^' ? 'start' : 'end'];
    case 'rep': return ['repeat', `${n.min}..${n.max === Infinity ? '∞' : n.max}${n.lazy ? ' lazy' : ' greedy'}`];
    case 'group': return ['group', n.idx ? `capture ${n.idx}` : 'non-capturing'];
    case 'cat': return ['sequence', `${n.kids.length} in a row`];
    case 'alt': return ['choice', `${n.kids.length} branches`];
    case 'empty': return ['empty', 'matches nothing, successfully'];
  }
  return [n.t, ''];
}

function renderAst() {
  const box = $('#ast');
  box.textContent = '';
  if (!state.result) return;
  const pat = $('#pat').value;
  const hot = new Set();
  const btTrace = state.result.bt.trace;
  const step = btTrace[Math.min(state.pos * 3, btTrace.length - 1)];
  if (step) hot.add(step.node);

  const walk = (n, d) => {
    const [t, v] = describe(n);
    box.append(h('div', {
      class: 'row' + (hot.has(n) ? ' hi' : ''),
      title: `pattern[${n.from}..${n.to}]`,
    },
      h('span', { class: 'g' }, '│ '.repeat(d)),
      h('span', { class: 't' }, t),
      h('span', { class: 'v' }, v),
      h('span', { class: 'g' }, pat.slice(n.from, n.to).length <= 14 ? `‹${pat.slice(n.from, n.to)}›` : '')
    ));
    for (const k of n.kids || (n.kid ? [n.kid] : [])) walk(k, d + 1);
  };
  walk(state.result.ast, 0);
}

function renderRace() {
  const { sim, bt } = state.result;
  const v = $('#verdict');
  v.textContent = '';
  const agree = sim.fullMatch === bt.matched && !bt.aborted;
  v.append(
    h('span', { class: 'tag ' + (sim.fullMatch ? 'ok' : 'bad') }, sim.fullMatch ? 'match' : 'no match'),
    h('span', { class: 'big' }, sim.fullMatch ? 'the whole subject matches' : sim.longestPrefix >= 0 ? `longest prefix: ${sim.longestPrefix} char${sim.longestPrefix === 1 ? '' : 's'}` : 'fails at once')
  );

  const box = $('#race');
  box.textContent = '';
  const cap = 200000;
  const scale = (n) => Math.min(1, Math.log10(Math.max(1, n)) / Math.log10(cap));
  const row = (name, n, danger, note) => h('div', { class: 'row' },
    h('div', { class: 'top' }, name, h('b', {}, fmt.n(n) + (danger ? '+' : ''))),
    h('div', { class: 'bar' + (danger ? ' danger' : '') }, h('i', { style: { width: (scale(n) * 100).toFixed(1) + '%' } })),
    note ? h('div', { class: 'note' }, note) : null
  );
  box.append(
    row('parallel sim · edge tests', sim.work, false,
      `bounded by ${state.result.nfa.states.length} states x ${$('#inp').value.length} chars — it cannot blow up`),
    row('backtracking · steps', bt.steps, bt.aborted,
      bt.aborted
        ? 'aborted at the 200k cap. This is the shape of an outage: the same pattern in JavaScript, Python or PCRE would still be running.'
        : `peak recursion depth ${bt.peakDepth}` + (agree ? ' — both engines agree' : ''))
  );
  if (bt.aborted) box.append(h('div', { class: 'hint', style: { marginTop: '4px' } },
    'Add one character to the subject and watch the step count roughly double.'));
}

function renderSide() {
  const box = $('#side');
  box.textContent = '';
  if (!state.result) return;
  if (state.tab === 'trace') {
    const { trace, steps, aborted } = state.result.bt;
    const pat = $('#pat').value;
    box.append(h('div', { class: 'hint', style: { marginBottom: '8px' } },
      `${trace.length} decisions shown, in the order the backtracker made them — out of ${fmt.n(steps)}${aborted ? '+' : ''} engine steps.`));
    const list = h('div', { class: 'trace' });
    for (const t of trace) {
      list.append(h('div', { class: 'r' },
        h('span', { class: 'st' }, t.step),
        h('span', { class: 'act a-' + t.act }, t.act),
        h('span', { class: 'src' }, `@${t.pos}`),
        h('span', { class: 'mute' }, '‹' + pat.slice(t.node.from, t.node.to) + '›')
      ));
    }
    box.append(list);
  } else {
    const dfa = state.result.dfa;
    box.append(h('div', { class: 'hint', style: { marginBottom: '8px' } },
      `${dfa.states.length} DFA states from ${state.result.nfa.states.length} NFA states. ` +
      (dfa.anchorsApproximated ? 'Assertions are followed unconditionally here, so read this table as the pattern’s shape. ' : '') +
      'Columns are representative characters drawn from the pattern itself.'));
    const cols = dfa.alphabet.slice(0, 12);
    const tbl = h('table', { class: 'data dfa' },
      h('thead', {}, h('tr', {}, h('th', {}, 'q'), ...cols.map((c) => h('th', { class: 'r' }, c === ' ' ? '␣' : c)))),
      h('tbody', {}, ...dfa.states.map((s) => h('tr', {},
        h('td', { class: s.accepting ? 'acc' : '' }, (s.accepting ? '◉' : '○') + ' ' + s.id),
        ...cols.map((c) => h('td', { class: 'r' + (s.edges[c] === undefined ? ' mute' : '') }, s.edges[c] === undefined ? '·' : s.edges[c]))
      )))
    );
    box.append(tbl);
    if (dfa.alphabet.length > cols.length) box.append(h('div', { class: 'hint', style: { marginTop: '6px' } }, `+${dfa.alphabet.length - cols.length} more columns`));
  }
}

function renderStatus() {
  const s = $('#status');
  s.textContent = '';
  if (state.error) { s.append(h('span', {}, h('b', {}, 'parse error'))); return; }
  const { nfa, dfa, sim, bt, groups } = state.result;
  s.append(
    h('span', {}, h('b', {}, 'nfa '), `${nfa.states.length} states`),
    h('span', {}, h('b', {}, 'dfa '), `${dfa.states.length} states${dfa.truncated ? '+' : ''}`),
    h('span', {}, h('b', {}, 'groups '), groups),
    h('span', {}, h('b', {}, 'frames '), sim.frames.length),
    h('span', {}, h('b', {}, 'backtrack '), fmt.n(bt.steps) + (bt.aborted ? ' (capped)' : ' steps')),
    h('span', { class: 'spacer', style: { flex: 1 } }),
    h('span', {}, 'built in-browser · no regex library')
  );
  $('#nfameta').textContent = `${nfa.states.length} states · q${nfa.start} start · q${nfa.accept} accept`;
}

/* ── recompute ──────────────────────────────────────────────────────────── */
function recompute(resetPos = true) {
  const pat = $('#pat').value;
  const inp = $('#inp').value;
  try {
    state.result = build(pat, inp);
    state.error = null;
    $('#err').hidden = true;
    $('#pat').classList.remove('bad');
  } catch (e) {
    if (!(e instanceof ParseError)) throw e;
    state.error = e;
    $('#pat').classList.add('bad');
    const box = $('#err');
    box.hidden = false;
    box.textContent = '';
    box.append(
      h('span', { class: 'caret' }, ' '.repeat(Math.max(0, e.at)) + '^ '),
      h('span', {}, e.message)
    );
    return;
  }
  if (resetPos) state.pos = 0;
  state.pos = clamp(state.pos, 0, state.result.sim.frames.length - 1);
  renderTape(); renderFrameInfo(); renderAst(); renderRace(); renderSide(); renderStatus(); draw();
}

/* ── wiring ─────────────────────────────────────────────────────────────── */
$('#pat').addEventListener('input', () => recompute());
$('#inp').addEventListener('input', () => recompute());
$('#prev').onclick = () => setPos(state.pos - 1);
$('#next').onclick = () => setPos(state.pos + 1);
$('#rew').onclick = () => setPos(0);
$('#play').onclick = togglePlay;

$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  state.tab = b.dataset.tab;
  [...$('#tabs').children].forEach((c) => c.classList.toggle('on', c === b));
  renderSide();
});

const presets = $('#presets');
presets.append(h('span', { class: 'hint', style: { marginRight: '2px' } }, 'try:'));
for (const [p, i, label] of PRESETS) {
  presets.append(h('button', {
    class: 'mono',
    title: p,
    onclick: () => { $('#pat').value = p; $('#inp').value = i; recompute(); },
  }, label));
}

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.key === 'ArrowRight') { setPos(state.pos + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { setPos(state.pos - 1); e.preventDefault(); }
  if (e.key === ' ') { togglePlay(); e.preventDefault(); }
});

recompute();
addEventListener('resize', () => fit());

/* the plain-English briefing — opens itself once on a first visit */
$('#explainSlot').append(explainButton(explainer(BRIEFINGS['regex-lab'])));

</script>

<script type="module" src="../../shared/navigator.js"></script>
</body>
</html>

<link rel="icon" href="../../favicon.svg" />
<meta name="theme-color" content="#06070d" />
<title>Diff Forge</title>
<meta name="description" content="Myers and patience diffs plus a three-way merge, showing how git decides — and where it refuses to." />
<link rel="stylesheet" href="../../shared/lab.css" />
<style>
  main {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr) 316px;
    gap: 10px; padding: 10px 12px; min-height: 0;
  }
  @media (max-width: 1240px) { main { grid-template-columns: 278px minmax(0,1fr); } main > .third { display: none; } }

  .editors { display: grid; grid-template-rows: repeat(3, 1fr); gap: 8px; min-height: 0; }
  .ed { display: flex; flex-direction: column; min-height: 0; }
  .ed .lbl { display: flex; align-items: center; gap: 6px; font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-mute); margin-bottom: 4px; }
  .ed .lbl .pip { width: 6px; height: 6px; border-radius: 50%; }
  .ed textarea { flex: 1; min-height: 60px; font-size: 11.5px; line-height: 1.55; }

  .scen { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .scen button { font: 400 11px/1 var(--sans); padding: 5px 8px; }

  /* ── code ────────────────────────────────────────────────── */
  .code { font: 400 12px/1.65 var(--mono); }
  .ln { display: flex; white-space: pre; }
  .ln .g { width: 34px; flex: none; text-align: right; padding-right: 9px; color: var(--fg-ghost); user-select: none; font-size: 10.5px; }
  .ln .mark { width: 13px; flex: none; color: var(--fg-ghost); }
  .ln .txt { flex: 1; }
  /* in a narrow conflict pane there is no room to scroll each line, so wrap
     with a hanging indent instead; the side-by-side view scrolls as a whole */
  .code.tight .ln { white-space: pre-wrap; }
  .code.tight .ln .txt { padding-left: 14px; text-indent: -14px; }
  .code.tight .g, .code.tight .mark { display: none; }
  .sbs .code { overflow-x: auto; }
  .ln.ctx { color: var(--fg-mute); }
  .ln.add { background: color-mix(in oklab, var(--ok) 13%, transparent); color: var(--fg); }
  .ln.del { background: color-mix(in oklab, var(--bad) 13%, transparent); color: var(--fg); }
  .ln.add .mark { color: var(--ok); }
  .ln.del .mark { color: var(--bad); }
  .ln em { font-style: normal; border-radius: 2px; padding: 0 1px; }
  .ln.add em { background: color-mix(in oklab, var(--ok) 32%, transparent); }
  .ln.del em { background: color-mix(in oklab, var(--bad) 32%, transparent); }
  .fold {
    font: 400 10.5px/1 var(--mono); color: var(--fg-ghost);
    padding: 5px 0 5px 47px; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line);
    margin: 3px 0; cursor: pointer;
  }
  .fold:hover { color: var(--accent); }

  /* ── merge chunks ────────────────────────────────────────── */
  .chunk { border-radius: var(--r-sm); margin-bottom: 4px; }
  .chunk.auto { border-left: 2px solid var(--line-bright); background: var(--ink-750); }
  .chunk.auto.ours { border-left-color: var(--accent); }
  .chunk.auto.theirs { border-left-color: var(--viol); }
  .chunk.auto.agreed { border-left-color: var(--ok); }
  .chunk .note {
    display: flex; align-items: center; gap: 7px;
    font: 400 10.5px/1 var(--mono); color: var(--fg-mute);
    padding: 5px 9px 4px;
  }
  .chunk.auto .code { padding: 0 9px 6px; }

  .conflict { border: 1px solid var(--bad); border-radius: var(--r); margin: 8px 0; overflow: hidden; }
  .conflict > .top {
    display: flex; align-items: center; gap: 8px;
    background: color-mix(in oklab, var(--bad) 12%, transparent);
    padding: 7px 9px; font: 500 11px/1.3 var(--sans); color: var(--bad);
  }
  .conflict > .top .why { color: var(--fg-dim); font-weight: 400; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; }
  .side { border-top: 1px solid var(--line); padding: 7px 9px; cursor: pointer; }
  .side + .side { border-left: 1px solid var(--line); }
  .side .h { display: flex; align-items: center; gap: 6px; font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-mute); margin-bottom: 5px; }
  .side.picked { background: color-mix(in oklab, var(--accent) 10%, transparent); }
  .side.picked .h { color: var(--accent); }
  .side .code { font-size: 11.5px; }
  .actions { display: flex; gap: 5px; padding: 7px 9px; border-top: 1px solid var(--line); }
  .actions button { font: 400 11px/1 var(--sans); padding: 5px 8px; }

  .tabs { display: flex; gap: 2px; }
  .tabs button { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; }

  /* ── side-by-side diff ───────────────────────────────────── */
  .sbs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
  .sbs > div { background: var(--ink-800); min-width: 0; }
  .sbs .cap { font: 500 10px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-mute); padding: 7px 9px; border-bottom: 1px solid var(--line); }

  .cmp { display: flex; gap: 8px; margin-bottom: 9px; }
  .cmp .c { flex: 1; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 8px; cursor: pointer; }
  .cmp .c.on { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, transparent); }
  .cmp .c .n { font: 600 11px/1.3 var(--sans); }
  .cmp .c .v { font: 400 11px/1.5 var(--mono); color: var(--fg-mute); }
  .cmp .c.on .n { color: var(--accent); }

  h3.sec { font: 600 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-mute); margin: 13px 0 7px; }
  h3.sec:first-child { margin-top: 0; }
  pre.out {
    font: 400 11px/1.6 var(--mono); background: var(--ink-750); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 8px; margin: 0; white-space: pre; overflow: auto; max-height: 320px; color: var(--fg-dim);
  }
  pre.out .mk { color: var(--bad); }
</style>

<div class="shell">
  <header class="bar">
    <a class="home" href="../../index.html">&larr; INDEX</a>
    <h1>Diff Forge</h1>
    <span class="sub">how git decides &mdash; and where it refuses to</span>
    <span class="spacer"></span>
    <span class="hint" style="margin-right:8px">edit any pane; everything recomputes</span>
    <span id="explainSlot"></span>
    <button id="theme" class="mono ghost">&#9681; dark</button>
  </header>

  <main>
    <section class="panel">
      <div class="head">inputs</div>
      <div class="body" style="display:flex; flex-direction:column; min-height:0">
        <div class="scen" id="scen"></div>
        <div class="editors" style="flex:1">
          <div class="ed">
            <div class="lbl"><span class="pip" style="background:var(--fg-mute)"></span>base &mdash; the common ancestor</div>
            <textarea id="base" spellcheck="false"></textarea>
          </div>
          <div class="ed">
            <div class="lbl"><span class="pip" style="background:var(--accent)"></span>ours &mdash; your branch</div>
            <textarea id="ours" spellcheck="false"></textarea>
          </div>
          <div class="ed">
            <div class="lbl"><span class="pip" style="background:var(--viol)"></span>theirs &mdash; the incoming branch</div>
            <textarea id="theirs" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="head">
        <div class="tabs" id="tabs">
          <button data-tab="merge" class="on">three-way merge</button>
          <button data-tab="diff">ours vs theirs</button>
        </div>
        <span class="spacer"></span>
        <span class="mute num" id="centermeta"></span>
      </div>
      <div class="body" id="center"></div>
    </section>

    <section class="panel third">
      <div class="head">algorithm &amp; result</div>
      <div class="body" id="right"></div>
    </section>
  </main>

  <footer class="status" id="status"></footer>
</div>

<script type="module">
import { h, $, themeToggle, fmt, explainer, explainButton } from '../../shared/lab.js';
import { BRIEFINGS } from '../../shared/briefings.js';
import { myers, patience, lines, merge3, resolve, hunks, stats, words, SCENARIOS } from './engine.js';

themeToggle($('#theme'));

let algo = 'myers';
let tab = 'merge';
let chunks = [];
let note = SCENARIOS[0].note;

const algos = { myers, patience };

/* ── rendering helpers ──────────────────────────────────────────────────── */
const codeLine = (text, cls, gutter, mark, runs) => h('div', { class: 'ln ' + cls },
  h('span', { class: 'g' }, gutter ?? ''),
  h('span', { class: 'mark' }, mark ?? ''),
  h('span', { class: 'txt' }, runs
    ? runs.map((r) => (r.eq ? document.createTextNode(r.t) : h('em', {}, r.t)))
    : (text === '' ? ' ' : text)));

const codeBlock = (arr, cls, startAt = null) => h('div', { class: 'code' },
  ...arr.map((l, i) => codeLine(l, cls, startAt === null ? '' : startAt + i, '')));

/* ── merge view ─────────────────────────────────────────────────────────── */
function renderMerge() {
  const box = $('#center');
  box.textContent = '';
  let conflicts = 0;

  for (const [ci, c] of chunks.entries()) {
    if (c.type === 'stable') {
      if (c.lines.length > 7) {
        const head = c.lines.slice(0, 2), tail = c.lines.slice(-2);
        const hidden = c.lines.length - 4;
        const wrap = h('div', {});
        wrap.append(codeBlock(head, 'ctx'));
        const fold = h('div', { class: 'fold' }, `⋯ ${hidden} unchanged lines — click to expand`);
        fold.onclick = () => { fold.replaceWith(codeBlock(c.lines.slice(2, -2), 'ctx')); };
        wrap.append(fold, codeBlock(tail, 'ctx'));
        box.append(wrap);
      } else box.append(codeBlock(c.lines, 'ctx'));
      continue;
    }

    if (c.type !== 'conflict') {
      const label = { ours: 'taken from your branch', theirs: 'taken from the incoming branch', agreed: 'both branches made the same edit' }[c.type];
      box.append(h('div', { class: 'chunk auto ' + c.type },
        h('div', { class: 'note' },
          h('span', { class: 'tag ' + (c.type === 'agreed' ? 'ok' : 'mute') }, 'auto'),
          label, h('span', { class: 'mute' }, '— ' + c.why)),
        codeBlock(c.lines, c.type === 'agreed' ? 'ctx' : 'add')));
      continue;
    }

    conflicts++;
    // when both sides changed the same number of lines, diff them pairwise so
    // the actual differing tokens are highlighted rather than whole lines
    const paired = c.ours.length === c.theirs.length
      ? c.ours.map((l, i) => words(l, c.theirs[i]))
      : null;
    const pick = (choice) => { c.resolution = c.resolution === choice ? null : choice; render(); };
    const el = h('div', { class: 'conflict' },
      h('div', { class: 'top' },
        h('span', { class: 'tag bad' }, 'conflict ' + conflicts),
        h('span', {}, `${c.base.length} base line${c.base.length === 1 ? '' : 's'}`),
        h('span', { class: 'why' }, '— ' + c.why),
        h('span', { style: { flex: 1 } }),
        c.resolution ? h('span', { class: 'tag ok' }, 'resolved: ' + c.resolution) : h('span', { class: 'tag warn' }, 'undecided')),
      h('div', { class: 'sides' },
        h('div', { class: 'side' + (c.resolution === 'ours' ? ' picked' : ''), onclick: () => pick('ours') },
          h('div', { class: 'h' }, h('span', { class: 'pip', style: { width: '6px', height: '6px', borderRadius: '50%', background: 'var(--accent)' } }), 'ours'),
          h('div', { class: 'code tight' }, ...c.ours.map((l, i) => codeLine(l, 'del', '', '', paired?.[i]?.left)))),
        h('div', { class: 'side' + (c.resolution === 'theirs' ? ' picked' : ''), onclick: () => pick('theirs') },
          h('div', { class: 'h' }, h('span', { class: 'pip', style: { width: '6px', height: '6px', borderRadius: '50%', background: 'var(--viol)' } }), 'theirs'),
          h('div', { class: 'code tight' }, ...c.theirs.map((l, i) => codeLine(l, 'add', '', '', paired?.[i]?.right))))),
      h('div', { class: 'actions' },
        h('button', { class: c.resolution === 'ours' ? 'on' : '', onclick: () => pick('ours') }, 'keep ours'),
        h('button', { class: c.resolution === 'theirs' ? 'on' : '', onclick: () => pick('theirs') }, 'keep theirs'),
        h('button', { class: c.resolution === 'both' ? 'on' : '', onclick: () => pick('both') }, 'keep both'),
        h('button', { class: c.resolution === 'base' ? 'on' : '', onclick: () => pick('base') }, 'revert to base'),
        h('span', { style: { flex: 1 } }),
        h('span', { class: 'hint' }, 'the base said: ', h('code', { class: 'inline' }, c.base.join(' ⏎ ').slice(0, 42) || '(nothing)')))
    );
    box.append(el);
  }

  const auto = chunks.filter((c) => ['ours', 'theirs', 'agreed'].includes(c.type)).length;
  $('#centermeta').textContent = `${chunks.length} regions · ${auto} merged automatically · ${conflicts} conflict${conflicts === 1 ? '' : 's'}`;
}

/* ── diff view ──────────────────────────────────────────────────────────── */
function renderDiff() {
  const box = $('#center');
  box.textContent = '';
  const a = lines($('#ours').value), b = lines($('#theirs').value);
  const { ops } = algos[algo](a, b);
  const groups = hunks(ops, 3);

  const left = h('div', {}, h('div', { class: 'cap' }, 'ours'));
  const right = h('div', {}, h('div', { class: 'cap' }, 'theirs'));
  const lc = h('div', { class: 'code' }), rc = h('div', { class: 'code' });
  left.append(lc); right.append(rc);

  for (const g of groups) {
    if (g.skipped && g.leading) {
      lc.append(h('div', { class: 'fold' }, `⋯ ${g.skipped} unchanged`));
      rc.append(h('div', { class: 'fold' }, `⋯ ${g.skipped} unchanged`));
    }
    // pair deletes with inserts so a modified line sits opposite its twin
    const rows = [];
    let pendingDel = [];
    const flush = () => {
      for (let i = 0; i < Math.max(pendingDel.length, 0); i++) rows.push({ l: pendingDel[i], r: null });
      pendingDel = [];
    };
    let queue = [...g.ops];
    while (queue.length) {
      const op = queue.shift();
      if (op.type === 'equal') { flush(); rows.push({ l: op, r: op, eq: true }); continue; }
      if (op.type === 'delete') { pendingDel.push(op); continue; }
      if (pendingDel.length) rows.push({ l: pendingDel.shift(), r: op });
      else rows.push({ l: null, r: op });
    }
    flush();

    for (const row of rows) {
      if (row.eq) {
        lc.append(codeLine(a[row.l.a], 'ctx', row.l.a + 1, ''));
        rc.append(codeLine(b[row.r.b], 'ctx', row.r.b + 1, ''));
        continue;
      }
      const pair = row.l && row.r ? words(a[row.l.a], b[row.r.b]) : null;
      lc.append(row.l ? codeLine(a[row.l.a], 'del', row.l.a + 1, '−', pair?.left) : codeLine('', 'ctx', '', ''));
      rc.append(row.r ? codeLine(b[row.r.b], 'add', row.r.b + 1, '+', pair?.right) : codeLine('', 'ctx', '', ''));
    }
    if (g.skipped && !g.leading) {
      lc.append(h('div', { class: 'fold' }, `⋯ ${g.skipped} unchanged`));
      rc.append(h('div', { class: 'fold' }, `⋯ ${g.skipped} unchanged`));
    }
  }

  box.append(h('div', { class: 'sbs' }, left, right));
  const s = stats(ops);
  const nh = groups.filter((g) => g.ops.length).length;
  $('#centermeta').textContent = `${algo} · ${nh} hunk${nh === 1 ? '' : 's'} · +${s.added} −${s.removed}`;
}

/* ── right panel ────────────────────────────────────────────────────────── */
function renderRight() {
  const box = $('#right');
  box.textContent = '';
  const a = lines($('#ours').value), b = lines($('#theirs').value);

  box.append(h('h3', { class: 'sec' }, 'diff algorithm'));
  const cmp = h('div', { class: 'cmp' });
  for (const name of ['myers', 'patience']) {
    const r = algos[name](a, b);
    const hs = hunks(r.ops, 3).filter((g) => g.ops.length).length;
    cmp.append(h('div', {
      class: 'c' + (algo === name ? ' on' : ''),
      onclick: () => { algo = name; render(); },
    },
      h('div', { class: 'n' }, name),
      h('div', { class: 'v' }, `${r.d} edits`),
      h('div', { class: 'v' }, `${hs} hunk${hs === 1 ? '' : 's'}`)));
  }
  box.append(cmp);
  box.append(h('div', { class: 'hint' },
    'Both produce a correct edit script. Myers finds a shortest one; patience anchors on lines that appear exactly once, so it refuses to pair up an unrelated closing brace. Fewer, fatter hunks usually read better — and the merge uses whichever you pick here.'));

  box.append(h('h3', { class: 'sec' }, 'merged result'));
  const { text, unresolved } = resolve(chunks);
  const pre = h('pre', { class: 'out' });
  for (const line of text.split('\n')) {
    const marker = /^(<<<<<<<|=======|>>>>>>>)/.test(line);
    pre.append(h('span', { class: marker ? 'mk' : '' }, line + '\n'));
  }
  box.append(pre);
  box.append(h('div', { style: { display: 'flex', gap: '6px', marginTop: '8px', alignItems: 'center' } },
    h('button', {
      onclick: async (e) => {
        try { await navigator.clipboard.writeText(text); e.target.textContent = 'copied'; setTimeout(() => (e.target.textContent = 'copy result'), 1200); }
        catch { e.target.textContent = 'clipboard blocked'; }
      },
    }, 'copy result'),
    unresolved
      ? h('span', { class: 'tag bad' }, `${unresolved} conflict marker${unresolved === 1 ? '' : 's'} left`)
      : h('span', { class: 'tag ok' }, 'clean')));

  box.append(h('h3', { class: 'sec' }, 'this scenario'));
  box.append(h('div', { class: 'hint' }, note));
}

/* ── recompute ──────────────────────────────────────────────────────────── */
function recompute() {
  const prev = new Map(chunks.filter((c) => c.type === 'conflict').map((c, i) => [i, c.resolution]));
  chunks = merge3(lines($('#base').value), lines($('#ours').value), lines($('#theirs').value), algos[algo]);
  let ci = 0;
  for (const c of chunks) if (c.type === 'conflict') { c.resolution = prev.get(ci) ?? null; ci++; }
  render();
}

function render() {
  tab === 'merge' ? renderMerge() : renderDiff();
  renderRight();
  const conflicts = chunks.filter((c) => c.type === 'conflict');
  const undecided = conflicts.filter((c) => !c.resolution).length;
  const st = $('#status');
  st.textContent = '';
  st.append(...[
    h('span', {}, h('b', {}, 'base '), lines($('#base').value).length + ' lines'),
    h('span', {}, h('b', {}, 'regions '), chunks.length),
    h('span', {}, h('b', {}, 'conflicts '), conflicts.length),
    undecided
      ? h('span', { style: { color: 'var(--warn)' } }, `${undecided} still undecided`)
      : h('span', { style: { color: 'var(--ok)' } }, 'every conflict resolved'),
    h('span', { style: { flex: 1 } }),
    h('span', {}, 'Myers O(ND) · patience anchoring · diff3'),
  ]);
}

/* ── wiring ─────────────────────────────────────────────────────────────── */
const scen = $('#scen');
SCENARIOS.forEach((s, i) => {
  scen.append(h('button', {
    onclick: () => {
      $('#base').value = s.base; $('#ours').value = s.ours; $('#theirs').value = s.theirs;
      note = s.note;
      chunks = [];
      recompute();
    },
  }, s.name));
});

$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  tab = b.dataset.tab;
  [...$('#tabs').children].forEach((c) => c.classList.toggle('on', c === b));
  render();
});

for (const id of ['base', 'ours', 'theirs']) $('#' + id).addEventListener('input', recompute);

$('#base').value = SCENARIOS[0].base;
$('#ours').value = SCENARIOS[0].ours;
$('#theirs').value = SCENARIOS[0].theirs;
recompute();

/* the plain-English briefing — opens itself once on a first visit */
$('#explainSlot').append(explainButton(explainer(BRIEFINGS['diff-forge'])));

</script>

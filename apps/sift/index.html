<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="../../favicon.svg" />
<meta name="theme-color" content="#0a0d16" />
<title>Sift — drop a CSV in and see what is actually in it</title>
<meta name="description" content="Drop a spreadsheet in and it tells you what each column holds: the type, the gaps, the range, the shape. Sort and filter a hundred thousand rows without it stuttering. Nothing leaves your device." />
<meta property="og:title" content="Sift — drop a CSV in and see what is actually in it" />
<meta property="og:description" content="Column types, gaps, ranges and distributions, plus a filter language. A hundred thousand rows, in the browser, nothing uploaded." />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #0a0d16; --panel: #0f1422; --line: rgba(255,255,255,.09);
    --line2: rgba(255,255,255,.16); --ink: #e9eefb; --dim: rgba(233,238,251,.52);
    --dimmer: rgba(233,238,251,.33); --accent: #5fb8ff;
    --num: #7ee0b0; --date: #c9a6ff; --cat: #ffc46b; --txt: #9fb3d9; --bool: #ff9bb0;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }

  #shell { display: flex; flex-direction: column; height: 100dvh; }

  header.bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .back { color: var(--dim); text-decoration: none; font: 600 11.5px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .07em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; }
  .back:hover { color: var(--ink); border-color: var(--line2); }
  .title { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  .title small { font-weight: 500; color: var(--dimmer); margin-left: 8px; font-size: 12px; letter-spacing: 0; }
  .grow { flex: 1 1 auto; }
  button.act, label.act {
    border: 1px solid var(--line2); background: rgba(255,255,255,.06); color: var(--ink);
    border-radius: 9px; padding: 8px 12px; font: 650 12.5px/1 "Inter", system-ui, sans-serif; cursor: pointer;
  }
  button.act:hover, label.act:hover { background: rgba(255,255,255,.12); }
  input[type=file] { display: none; }

  #query {
    flex: 1 1 260px; min-width: 0; max-width: 520px;
    background: #0b0f1c; border: 1px solid var(--line2); border-radius: 9px;
    color: var(--ink); padding: 9px 11px; font: 500 13px/1 ui-monospace, Menlo, monospace;
  }
  #query:focus { outline: none; border-color: var(--accent); }
  #query::placeholder { color: var(--dimmer); }

  #drop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: rgba(10,13,22,.88); font-size: 19px; font-weight: 700; color: var(--accent);
    border: 2px dashed var(--accent); }

  /* flex-shrink:0 matters. In a column flex container with a fixed height,
     a child with no set height is shrunk to make room for its siblings, and
     the profile cards were clipped to a twenty-pixel sliver. */
  #cols { flex: 0 0 auto; display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: #0c1120; }
  header.bar, footer.bar { flex: 0 0 auto; }
  #tablewrap { flex: 1 1 auto; min-height: 0; }
  .col {
    flex: 0 0 auto; width: 176px; border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 10px; background: var(--panel); cursor: pointer;
  }
  .col:hover { border-color: var(--line2); }
  .col.on { border-color: var(--accent); }
  .col h3 { margin: 0 0 3px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .col .type { font: 650 10px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em;
    text-transform: uppercase; }
  .t-integer, .t-decimal { color: var(--num); }
  .t-date { color: var(--date); }
  .t-category { color: var(--cat); }
  .t-text { color: var(--txt); }
  .t-boolean { color: var(--bool); }
  .col .facts { margin-top: 6px; font: 500 11px/1.5 ui-monospace, Menlo, monospace; color: var(--dim); }
  .col .warn { color: #ffb37a; }
  .spark { display: flex; align-items: flex-end; gap: 1px; height: 26px; margin-top: 7px; }
  .spark i { flex: 1; background: var(--accent); opacity: .55; border-radius: 1px 1px 0 0; min-height: 1px; }
  .bars { margin-top: 7px; display: grid; gap: 3px; }
  .bars div { position: relative; font: 500 10.5px/1.4 ui-monospace, Menlo, monospace;
    color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
  .bars div::before { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--w);
    background: rgba(95,184,255,.18); border-radius: 3px; }
  .bars span { position: relative; }

  #tablewrap { flex: 1 1 auto; overflow: auto; position: relative; }
  #head { position: sticky; top: 0; z-index: 5; display: flex; background: #0c1120;
    border-bottom: 1px solid var(--line2); width: max-content; min-width: 100%; }
  #head div { flex: 0 0 auto; padding: 9px 10px; font: 700 11.5px/1.2 "Inter", system-ui, sans-serif;
    border-right: 1px solid var(--line); cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #head div:hover { background: rgba(255,255,255,.05); }
  #head div:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .col:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #head .arrow { color: var(--accent); }
  #spacer { position: relative; width: max-content; min-width: 100%; }
  .row { position: absolute; left: 0; display: flex; width: max-content; min-width: 100%; }
  .row:nth-child(even) { background: rgba(255,255,255,.018); }
  .row span { flex: 0 0 auto; padding: 0 10px; font: 500 12px/26px ui-monospace, Menlo, monospace;
    border-right: 1px solid rgba(255,255,255,.05); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .row span.n { text-align: right; color: var(--ink); }
  .row span.blank::after { content: '—'; color: rgba(233,238,251,.18); }

  #empty { position: sticky; left: 0; margin: 46px auto; text-align: center;
    color: var(--dimmer); font-size: 14px; }

  footer.bar { border-top: 1px solid var(--line); border-bottom: none;
    font: 500 11.5px/1 ui-monospace, Menlo, monospace; color: var(--dim); padding: 9px 14px; gap: 18px; }
  footer b { color: var(--ink); font-weight: 700; }

  @media (max-width: 720px) {
    .title small { display: none; }
    .col { width: 150px; }
  }
</style>
</head>
<body>
<div id="shell">
  <header class="bar">
    <a class="back" href="../../index.html">&larr; INDEX</a>
    <span class="title">Sift <small id="sub">drop a CSV anywhere on this page</small></span>
    <input id="query" type="search" spellcheck="false"
      placeholder='filter:  london   status:shipped   total&gt;100' />
    <span class="grow"></span>
    <label class="act" for="file">Open a file</label>
    <input id="file" type="file" accept=".csv,.tsv,.txt,text/csv,text/plain" />
    <button class="act" id="big" type="button">100k rows</button>
  </header>

  <div id="cols"></div>

  <div id="tablewrap">
    <div id="head"></div>
    <div id="spacer"></div>
    <p id="empty" hidden>Nothing matches that.</p>
  </div>

  <footer class="bar">
    <span><b id="nrows">0</b> rows</span>
    <span><b id="ncols">0</b> columns</span>
    <span id="raggedWrap" hidden>· <b id="nragged">0</b> reshaped</span>
    <span class="grow"></span>
    <span id="timing"></span>
    <span>· nothing leaves your device</span>
  </footer>
</div>

<div id="drop" hidden>drop it anywhere</div>

<script type="module">
/* ───────────────────────────────────────────────────────────────────────────
   Sift — the part you can see.

   The parsing, profiling and filtering are in engine.js and know nothing
   about the DOM. Here: a table that draws only the rows you can actually see.

   THAT IS THE WHOLE TRICK OF THIS PAGE. A hundred thousand rows across eleven
   columns is 1.1 million elements, and a browser handed that will allocate
   for about forty seconds and then scroll at four frames a second. The fix is
   not to make the elements cheaper, it is not to make them: keep a tall empty
   box so the scrollbar is honest, work out which rows fall inside the
   viewport, and render those thirty or so. Scrolling then costs the same at a
   hundred rows and at a million.
   ─────────────────────────────────────────────────────────────────────────── */

import {
  parseTable, profile, compileFilter, filterIndices, sortIndices,
  sampleCSV, isBlank, toNumber,
} from './engine.js';

const ROW_H = 26;
const OVERSCAN = 6;          // rows drawn above and below, so a fast flick has something there

const el = (id) => document.getElementById(id);
const wrap = el('tablewrap'), spacer = el('spacer'), head = el('head'), colsEl = el('cols');

let table = { columns: [], rows: [], ragged: 0 };
let cols = [];               // the profiles
let widths = [];
let view = [];               // row indices after filter and sort
let sortCol = -1, sortDir = 1;
let pool = [];               // recycled row elements

/* ── loading ─────────────────────────────────────────────────────────────── */

function load(text, label) {
  const t0 = performance.now();
  table = parseTable(text);
  const parsed = performance.now() - t0;

  const t1 = performance.now();
  cols = profile(table.columns, table.rows);
  const profiled = performance.now() - t1;

  widths = cols.map((c) => {
    const numeric = c.type === 'integer' || c.type === 'decimal';
    const room = Math.max(String(c.name).length, numeric ? 9 : 14);
    return Math.min(300, Math.max(86, room * 8 + 24));
  });

  sortCol = -1; sortDir = 1;
  el('sub').textContent = label;
  el('nrows').textContent = table.rows.length.toLocaleString();
  el('ncols').textContent = table.columns.length;
  el('raggedWrap').hidden = table.ragged === 0;
  el('nragged').textContent = table.ragged;
  el('timing').textContent =
    `parsed in ${parsed.toFixed(0)}ms · profiled in ${profiled.toFixed(0)}ms`;

  paintColumns();
  paintHead();
  apply();
  wrap.scrollTop = 0;
}

/* ── the column cards ────────────────────────────────────────────────────── */

const fmt = (n) => {
  if (!Number.isFinite(n)) return '—';
  if (Math.abs(n) >= 1000) return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  return String(Math.round(n * 100) / 100);
};
const day = (t) => (Number.isFinite(t) ? new Date(t).toISOString().slice(0, 10) : '—');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function paintColumns() {
  colsEl.replaceChildren();
  cols.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'col';
    const gaps = c.blanks
      ? `<span class="warn">${c.blanks.toLocaleString()} blank</span>`
      : 'no gaps';
    const key = c.unique ? 'every value unique · ' : '';
    const odd = c.bad ? ` · <span class="warn">${c.bad.toLocaleString()} odd</span>` : '';

    let body = '';
    if (c.stats && c.type !== 'date') {
      body = `<div class="facts">${fmt(c.stats.min)} … ${fmt(c.stats.max)}<br>mean ${fmt(c.stats.mean)} · med ${fmt(c.stats.median)}</div>`;
      const max = Math.max(...c.histogram.map((b) => b.count), 1);
      body += `<div class="spark">${c.histogram
        .map((b) => `<i style="height:${Math.max(1, (b.count / max) * 100)}%"></i>`).join('')}</div>`;
    } else if (c.type === 'date') {
      body = `<div class="facts">${day(c.stats.min)}<br>to ${day(c.stats.max)}</div>`;
    } else if (c.unique) {
      // listing eight values with a count of one beside each tells you nothing
      body = `<div class="facts">looks like an identifier</div>`;
    } else {
      const max = Math.max(...(c.top || []).map((t) => t.count), 1);
      body = `<div class="bars">${(c.top || []).slice(0, 4).map((t) =>
        `<div style="--w:${(t.count / max) * 100}%"><span>${esc(t.value)} · ${t.count.toLocaleString()}</span></div>`).join('')}</div>`;
    }

    d.innerHTML = `<h3 title="${esc(c.name)}">${esc(c.name)}</h3>
      <span class="type t-${c.type}">${c.type}</span>
      <div class="facts">${key || (c.distinct !== undefined ? `${c.distinct.toLocaleString()} distinct · ` : '')}${gaps}${odd}</div>
      ${body}`;
    d.tabIndex = 0;
    d.setAttribute('role', 'button');
    d.setAttribute('aria-label', `Sort by ${c.name}`);
    d.addEventListener('click', () => sortBy(i));
    d.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(i); }
    });
    colsEl.append(d);
  });
}

/* ── the table head ──────────────────────────────────────────────────────── */

function paintHead() {
  head.replaceChildren();
  table.columns.forEach((name, i) => {
    /* A clickable div is invisible to a keyboard and silent to a screen
       reader. It costs three attributes to make the same element a real
       control, so it gets them. */
    const d = document.createElement('div');
    d.style.width = `${widths[i]}px`;
    d.title = name;
    d.textContent = name;
    d.tabIndex = 0;
    d.setAttribute('role', 'button');
    d.setAttribute('aria-label', `Sort by ${name}`);
    d.addEventListener('click', () => sortBy(i));
    d.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(i); }
    });
    head.append(d);
  });
}

function markHead() {
  [...head.children].forEach((d, i) => {
    const name = table.columns[i];
    d.innerHTML = i === sortCol
      ? `${esc(name)} <span class="arrow">${sortDir > 0 ? '↑' : '↓'}</span>`
      : esc(name);
    if (i === sortCol) d.setAttribute('aria-sort', sortDir > 0 ? 'ascending' : 'descending');
    else d.removeAttribute('aria-sort');
  });
  [...colsEl.children].forEach((d, i) => d.classList.toggle('on', i === sortCol));
}

function sortBy(i) {
  if (sortCol === i) sortDir = -sortDir;
  else { sortCol = i; sortDir = 1; }
  apply();
}

/* ── filter, sort, draw ──────────────────────────────────────────────────── */

let queryTimer = 0;
el('query').addEventListener('input', () => {
  clearTimeout(queryTimer);
  /* Debounced, because filtering a hundred thousand rows on every keystroke
     turns typing into a slideshow. 90ms is under the threshold where a person
     notices a delay and well over the cost of one pass. */
  queryTimer = setTimeout(apply, 90);
});

function apply() {
  const q = el('query').value.trim();
  const types = cols.map((c) => c.type);
  view = q
    ? filterIndices(table.rows, compileFilter(q, table.columns, types))
    : table.rows.map((_, i) => i);

  if (sortCol >= 0) {
    view = sortIndices(table.rows, sortCol, {
      type: cols[sortCol]?.type || 'text', dir: sortDir, indices: view,
    });
  }

  el('nrows').textContent = q
    ? `${view.length.toLocaleString()} / ${table.rows.length.toLocaleString()}`
    : table.rows.length.toLocaleString();
  markHead();
  el('empty').hidden = view.length > 0 || table.rows.length === 0;
  spacer.style.height = `${view.length * ROW_H}px`;
  const maxScroll = Math.max(0, view.length * ROW_H - wrap.clientHeight + head.offsetHeight);
  if (wrap.scrollTop > maxScroll) wrap.scrollTop = maxScroll;
  draw();
}

function draw() {
  const top = wrap.scrollTop - head.offsetHeight;
  const visible = Math.ceil(wrap.clientHeight / ROW_H) + OVERSCAN * 2;
  /* `first` is clamped into the list, and `need` cannot go negative. Scroll a
     hundred thousand rows down and then filter to three thousand and the
     scroll position is briefly past the end of the new list — first lands
     beyond last, need comes out negative, and the loop below pops an empty
     pool and hands removeChild an undefined. */
  const first = Math.min(Math.max(0, view.length - 1),
                         Math.max(0, Math.floor(top / ROW_H) - OVERSCAN));
  const last = Math.min(view.length, first + visible);
  const need = Math.max(0, last - first);

  /* Rows are recycled rather than rebuilt: creating and dropping thirty
     elements per frame is enough to make a trackpad flick feel notchy. */
  while (pool.length < need) {
    const r = document.createElement('div');
    r.className = 'row';
    for (let c = 0; c < table.columns.length; c++) r.append(document.createElement('span'));
    spacer.append(r);
    pool.push(r);
  }
  while (pool.length > need) {
    const r = pool.pop();
    if (r && r.parentNode === spacer) spacer.removeChild(r);
  }

  // a column count change means the cells inside each row have to change too
  if (pool.length && pool[0].children.length !== table.columns.length) {
    for (const r of pool) {
      r.replaceChildren();
      for (let c = 0; c < table.columns.length; c++) r.append(document.createElement('span'));
    }
  }

  for (let k = 0; k < need; k++) {
    const rowEl = pool[k];
    const row = table.rows[view[first + k]];
    rowEl.style.transform = `translateY(${(first + k) * ROW_H}px)`;
    const cells = rowEl.children;
    for (let c = 0; c < table.columns.length; c++) {
      const cell = cells[c];
      const v = row ? row[c] : '';
      const t = cols[c]?.type;
      const numeric = t === 'integer' || t === 'decimal';
      cell.style.width = `${widths[c]}px`;
      cell.className = isBlank(v) ? 'blank' : (numeric ? 'n' : '');
      cell.textContent = isBlank(v) ? '' : v;
    }
  }
}

let ticking = false;
wrap.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; draw(); });
});
addEventListener('resize', draw);

/* ── getting a file in ───────────────────────────────────────────────────── */

const readFile = (file) => {
  const r = new FileReader();
  r.onload = () => load(String(r.result), `${file.name} · ${(file.size / 1024 / 1024).toFixed(1)}MB`);
  r.onerror = () => { el('sub').textContent = 'could not read that file'; };
  r.readAsText(file);
};

el('file').addEventListener('change', (e) => { if (e.target.files[0]) readFile(e.target.files[0]); });

let dragDepth = 0;
const drop = el('drop');
/* dragenter and dragleave fire for every element the pointer crosses, so a
   single boolean flickers the overlay on and off across the whole page.
   Counting depth is the fix. */
addEventListener('dragenter', (e) => { e.preventDefault(); if (++dragDepth === 1) drop.hidden = false; });
addEventListener('dragleave', (e) => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; drop.hidden = true; } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0; drop.hidden = true;
  const f = e.dataTransfer?.files?.[0];
  if (f) readFile(f);
});

el('big').addEventListener('click', () => {
  el('sub').textContent = 'generating…';
  // a frame, so the label paints before the main thread is taken
  requestAnimationFrame(() => requestAnimationFrame(() =>
    load(sampleCSV(100000, 5), '100,000 generated orders')));
});

/* Something real on arrival: a tool with an empty state is a tool nobody sees
   working. */
load(sampleCSV(4000, 7), '4,000 generated orders · drop your own in');
window.siftTable = () => ({ table, cols, view, rendered: pool.length });
</script>
<script type="module" src="../../shared/navigator.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="../../favicon.svg" />
<meta name="theme-color" content="#1a1611" />
<title>The Room — a murder you solve by looking</title>
<meta name="description" content="Edmund Harkness is dead at his desk and the door was locked from the inside. One room, nineteen things to examine, four people to question, and five contradictions hidden among them. Nothing is a multiple-choice question." />
<meta property="og:title" content="The Room" />
<meta property="og:description" content="One room. Nineteen things to look at. Four people who will not all be telling the truth. Find the contradictions and name the murderer." />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #17130e; --panel: #201a13; --edge: #3a3025;
    --ink: #e9e1d0; --dim: #a2957f; --warm: #e0b164; --red: #d4795f; --green: #8fbf87;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .wrap { display: grid; grid-template-columns: 1fr 384px; height: 100%; }

  /* ── the plate ─────────────────────────────────────────────────────────── */
  .plate { position: relative; overflow: hidden; background: #0f0c08; display: grid; place-items: center; }
  .frame { position: relative; }
  canvas { display: block; box-shadow: 0 24px 80px rgba(0,0,0,.7); }

  .spot { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: none; }
  .spot::after {
    content: ''; position: absolute; inset: 10px; border-radius: 50%;
    background: rgba(43,34,25,.14); border: 1.6px solid rgba(43,34,25,.62);
    box-shadow: 0 0 0 2px rgba(233,225,208,.55);
    transition: inset .16s ease, background .16s ease, border-color .16s ease;
  }
  .spot:hover::after, .spot:focus-visible::after { inset: 3px; background: rgba(224,177,100,.32); border-color: #7a5a26; }
  .spot.seen::after { background: rgba(43,34,25,.10); border-style: dotted; border-color: rgba(43,34,25,.42); }
  .spot.fresh::after { animation: pulse 1.6s ease-in-out 3; }
  .spot:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
  @keyframes pulse {
    0%, 100% { inset: 10px; background: rgba(43,34,25,.24); }
    50% { inset: 2px; background: rgba(224,177,100,.5); }
  }
  .label { position: absolute; transform: translate(-50%, -140%); white-space: nowrap;
    font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em;
    padding: 4px 7px; border-radius: 5px; background: #17130e; color: var(--ink);
    border: 1px solid var(--edge); pointer-events: none; opacity: 0;
    transition: opacity .14s ease; }
  .spot:hover + .label, .spot:focus-visible + .label { opacity: 1; }

  /* ── the notebook ──────────────────────────────────────────────────────── */
  .book { background: var(--panel); border-left: 1px solid var(--edge);
    display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; }
  .head { padding: 16px 18px 12px; border-bottom: 1px solid var(--edge); }
  .head h1 { margin: 0 0 3px; font-size: 19px; font-weight: 400; letter-spacing: .01em; }
  .head p { margin: 0; color: var(--dim); font-size: 12.5px; }

  .tabs { display: flex; border-bottom: 1px solid var(--edge); }
  .tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--dim); padding: 10px 6px; cursor: pointer;
    font: 600 10.5px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--warm); }
  .tabs b { color: var(--warm); font-weight: 700; }

  .pane { overflow-y: auto; padding: 16px 18px 20px; min-height: 0; }
  .pane::-webkit-scrollbar { width: 9px; }
  .pane::-webkit-scrollbar-thumb { background: #3b3125; border-radius: 9px; }

  .empty { color: var(--dim); font-size: 13.5px; font-style: italic; }

  .entry { margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .entry:last-child { border-bottom: 0; }
  .entry h3 { margin: 0 0 5px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    font-family: ui-monospace, Menlo, monospace; color: var(--warm); font-weight: 700; }
  .entry p { margin: 0 0 7px; font-size: 14.5px; }
  .entry .said { margin: 0; color: var(--ink); font-size: 14.5px; }
  .entry .role { color: var(--dim); font-size: 12px; font-family: ui-monospace, Menlo, monospace;
    margin: 0 0 6px; }
  .fact { display: flex; gap: 8px; align-items: baseline; margin: 5px 0 0;
    font-size: 13px; color: var(--dim); }
  .fact::before { content: '·'; color: var(--warm); }

  .clash { border: 1px solid #5c3a2c; border-radius: 9px; padding: 12px 13px; margin: 0 0 12px;
    background: rgba(212,121,95,.06); }
  .clash h3 { margin: 0 0 9px; font-size: 14.5px; font-family: inherit; text-transform: none;
    letter-spacing: 0; color: var(--red); font-weight: 400; }
  .side { margin: 0 0 8px; }
  .side:last-child { margin-bottom: 0; }
  .side b { display: block; font: 700 10.5px/1.5 ui-monospace, Menlo, monospace;
    letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .side span { font-size: 13.5px; }
  .side i { color: var(--dim); font-size: 12px; font-style: normal; }
  .versus { text-align: center; font: 700 10px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .2em; color: var(--red); margin: 8px 0; opacity: .7; }

  .who { width: 100%; text-align: left; background: rgba(255,255,255,.03);
    border: 1px solid var(--edge); border-radius: 9px; padding: 10px 12px; margin: 0 0 8px;
    color: var(--ink); cursor: pointer; font: inherit; transition: background .15s, border-color .15s; }
  .who:hover { background: rgba(224,177,100,.1); border-color: #6b5228; }
  .who b { display: block; font-size: 14.5px; }
  .who i { font-style: normal; color: var(--dim); font-size: 12px;
    font-family: ui-monospace, Menlo, monospace; }
  .who[data-heard="1"] { opacity: .62; }

  .foot { padding: 12px 18px 14px; border-top: 1px solid var(--edge); display: flex; gap: 8px; }
  .btn { flex: 1; background: rgba(255,255,255,.05); border: 1px solid var(--edge);
    border-radius: 9px; padding: 10px; color: var(--ink); cursor: pointer;
    font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .09em;
    text-decoration: none; text-align: center; transition: background .15s, border-color .15s; }
  .btn:hover { background: rgba(224,177,100,.14); border-color: #6b5228; }
  .btn.warm { background: rgba(224,177,100,.14); border-color: #6b5228; color: var(--warm); }

  /* ── the verdict ───────────────────────────────────────────────────────── */
  .veil { position: fixed; inset: 0; z-index: 20; background: rgba(9,7,5,.93);
    display: grid; place-items: center; padding: 24px; overflow-y: auto; opacity: 0;
    pointer-events: none; transition: opacity .35s ease; }
  .veil.on { opacity: 1; pointer-events: auto; }
  .card { max-width: 620px; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 14px; padding: 26px 28px; }
  .card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 400; }
  .card .verdict { font: 700 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .16em;
    text-transform: uppercase; margin: 0 0 16px; }
  .card p { margin: 0 0 13px; font-size: 15px; }
  .card .sub { color: var(--dim); font-size: 13.5px; }
  .card ul { margin: 0 0 13px; padding-left: 18px; color: var(--dim); font-size: 13.5px; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .wrap { grid-template-columns: 1fr; height: auto; min-height: 100%; }
    .plate { padding: 10px 0; }
    .book { border-left: 0; border-top: 1px solid var(--edge); height: auto; min-height: 46vh; }
    .pane { max-height: none; overflow: visible; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="plate" id="plate">
    <div class="frame" id="frame"><canvas id="c"></canvas></div>
  </div>

  <div class="book">
    <div class="head">
      <h1 id="title"></h1>
      <p id="where"></p>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-found" aria-selected="true" aria-controls="pane">FOUND <b id="nFound"></b></button>
      <button role="tab" id="tab-people" aria-selected="false" aria-controls="pane">PEOPLE</button>
      <button role="tab" id="tab-clash" aria-selected="false" aria-controls="pane">CLASHES <b id="nClash"></b></button>
    </div>
    <div class="pane" id="pane" role="tabpanel"></div>
    <div class="foot">
      <a class="btn" href="../../index.html">&larr; INDEX</a>
      <button class="btn warm" id="accuse">NAME SOMEBODY</button>
    </div>
  </div>
</div>

<div class="veil" id="veil"><div class="card" id="card"></div></div>

<script type="module">
/* ───────────────────────────────────────────────────────────────────────────
   The Room — a murder you solve by looking at things.

   Three files and a clean split: case.js is the story and knows no rules,
   engine.js is the rules and knows no story beyond what the data says, and
   this is the only one that has ever heard of a pixel.

   The thing that makes it a mystery rather than a sequence of paragraphs is
   that the engine finds the contradictions itself, by comparing what the room
   says with what people say. Nothing in the case file is tagged as the lie.
   ─────────────────────────────────────────────────────────────────────────── */

import { SETTING, SUSPECTS, OBJECTS, CLAIMS } from './case.js';
import { Investigation, audit } from './engine.js';
import { drawRoom, anchors } from './plate.js';

/* The case checks itself out loud. A clue that has quietly stopped pointing
   anywhere is not a crash — the player just finds the mystery a bit thin —
   so it is worth failing noisily in the console rather than not at all. */
const problems = audit();
if (problems.length) console.error('The case does not hold together:\n' + problems.join('\n'));

const el = (id) => document.getElementById(id);
const game = new Investigation();
let tab = 'found';

el('title').textContent = SETTING.where;
el('where').textContent = SETTING.when;
document.title = `${SETTING.title} — ${SETTING.where}`;

/* ── the plate, and the things you can click on it ───────────────────────── */

const cv = el('c'), ctx = cv.getContext('2d');
const frame = el('frame');
const spots = new Map();

for (const o of OBJECTS) {
  const b = document.createElement('button');
  b.className = 'spot';
  b.type = 'button';
  b.dataset.id = o.id;
  b.setAttribute('aria-label', `Examine: ${o.name}`);
  b.addEventListener('click', () => look(o.id));
  const lab = document.createElement('span');
  lab.className = 'label';
  lab.textContent = o.name;
  frame.append(b, lab);
  spots.set(o.id, { button: b, label: lab });
}

function layout() {
  /* The plate keeps its proportions and the hotspots are positioned against
     the canvas box rather than the window, so a clue stays on the thing it
     belongs to at any size. */
  const host = el('plate');
  const pad = innerWidth > 900 ? 28 : 12;
  const availW = host.clientWidth - pad * 2;
  const availH = (innerWidth > 900 ? host.clientHeight : innerHeight * 0.62) - pad * 2;
  const ratio = 1.52;
  let w = availW, h = w / ratio;
  if (h > availH) { h = availH; w = h * ratio; }
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = `${Math.round(w)}px`;
  cv.style.height = `${Math.round(h)}px`;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawRoom(ctx, w, h);
  /* Positions come from the plate, which is where the room's geometry lives.
     Keeping a second copy in the case file meant every change to the drawing
     had to be mirrored by hand, and a clue that had slid off the thing it
     belonged to looked exactly like a clue that was working. */
  const A = anchors();
  for (const o of OBJECTS) {
    const s = spots.get(o.id);
    const p = A[o.id];
    if (!p) { s.button.hidden = true; continue; }
    s.button.style.left = s.label.style.left = `${p.x * w}px`;
    s.button.style.top = s.label.style.top = `${p.y * h}px`;
  }
  paintSpots();
}
addEventListener('resize', layout);

function paintSpots() {
  for (const o of OBJECTS) {
    const { button } = spots.get(o.id);
    const st = game.state(o.id);
    button.hidden = st === 'hidden';
    button.classList.toggle('seen', st === 'examined');
  }
}

/* ── looking at something ────────────────────────────────────────────────── */

function look(id) {
  const r = game.examine(id);
  if (!r.ok) return;
  paintSpots();
  /* Point at whatever just became available. Hiding a new clue somewhere in
     a drawing and saying nothing is not difficulty, it is a hunt. */
  for (const opened of r.opened) {
    const s = spots.get(opened);
    if (!s) continue;
    s.button.classList.remove('fresh');
    void s.button.offsetWidth;          // restart the animation
    s.button.classList.add('fresh');
  }
  show('found');
}

/* ── the notebook ────────────────────────────────────────────────────────── */

const pane = el('pane');
for (const name of ['found', 'people', 'clash']) {
  el(`tab-${name}`).addEventListener('click', () => show(name));
}

function show(which) {
  tab = which;
  for (const name of ['found', 'people', 'clash']) {
    el(`tab-${name}`).setAttribute('aria-selected', String(name === which));
  }
  render();
}

function render() {
  const p = game.progress();
  el('nFound').textContent = p.examined ? `${p.examined}/${p.objects}` : '';
  el('nClash').textContent = p.found ? `${p.found}` : '';

  pane.replaceChildren();
  if (tab === 'found') renderFound();
  else if (tab === 'people') renderPeople();
  else renderClash();
}

const node = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

function renderFound() {
  if (!game.examined.size) {
    pane.append(node('p', 'empty', SETTING.brief));
    return;
  }
  /* Newest first: the thing just looked at is the thing being thought about. */
  for (const step of [...game.order].reverse()) {
    if (step.kind !== 'object') continue;
    const o = OBJECTS.find((x) => x.id === step.id);
    const e = node('div', 'entry');
    e.append(node('h3', null, o.name), node('p', null, o.note));
    for (const f of o.facts) e.append(node('div', 'fact', f.says));
    pane.append(e);
  }
}

function renderPeople() {
  for (const s of SUSPECTS) {
    const heard = game.heard.has(s.id);
    const b = node('button', 'who');
    b.dataset.heard = heard ? '1' : '0';
    b.append(node('b', null, s.name), node('i', null, s.role));
    b.addEventListener('click', () => { game.question(s.id); render(); });
    pane.append(b);
    if (!heard) continue;
    const r = game.question(s.id);
    const e = node('div', 'entry');
    e.append(node('p', 'role', s.alibi), node('p', 'said', r.statement.text));
    for (const f of r.statement.facts) e.append(node('div', 'fact', f.says));
    pane.append(e);
  }
}

function renderClash() {
  const found = game.contradictions();
  if (!found.length) {
    pane.append(node('p', 'empty',
      'Nothing you have found yet disagrees with anything else you have found. '
      + 'Look at more of the room, and ask all four of them what they were doing.'));
    return;
  }
  for (const c of found) {
    const box = node('div', 'clash');
    box.append(node('h3', null, c.question));
    c.sides.forEach((side, i) => {
      if (i) box.append(node('div', 'versus', 'BUT'));
      const s = node('div', 'side');
      s.append(node('b', null, CLAIMS[c.claim][side.value]));
      for (const f of side.facts) {
        const row = node('div');
        row.append(node('span', null, f.says + ' '), node('i', null, `— ${f.from}`));
        s.append(row);
      }
      box.append(s);
    });
    pane.append(box);
  }
}

/* ── naming somebody ─────────────────────────────────────────────────────── */

const veil = el('veil'), card = el('card');
el('accuse').addEventListener('click', openAccuse);
veil.addEventListener('click', (e) => { if (e.target === veil) closeVeil(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVeil(); });

function openVeil() { veil.classList.add('on'); }
function closeVeil() { veil.classList.remove('on'); }

function openAccuse() {
  card.replaceChildren();
  card.append(node('h2', null, 'Who killed Edmund Harkness?'));
  const p = game.progress();
  card.append(node('p', 'sub',
    `You have looked at ${p.examined} of ${p.objects} things, questioned ${p.heard} of ${p.people}, `
    + `and found ${p.found} of ${p.contradictions} contradictions. You can name somebody now, `
    + `but a name is only worth something if you can point at what proves it.`));
  for (const s of SUSPECTS) {
    const b = node('button', 'who');
    b.append(node('b', null, s.name), node('i', null, s.alibi));
    b.addEventListener('click', () => verdict(s.id));
    card.append(b);
  }
  const back = node('button', 'btn', 'KEEP LOOKING');
  back.addEventListener('click', closeVeil);
  card.append(back);
  openVeil();
}

function verdict(who) {
  const v = game.accuse(who);
  card.replaceChildren();
  card.append(node('h2', null, v.person.name));

  const line = node('p', 'verdict');
  if (v.earned) { line.textContent = 'Correct, and you can prove it'; line.style.color = 'var(--green)'; }
  else if (v.right) { line.textContent = 'Correct — but you were guessing'; line.style.color = 'var(--warm)'; }
  else { line.textContent = 'Not your man'; line.style.color = 'var(--red)'; }
  card.append(line);

  if (v.missed) card.append(node('p', null, v.missed));
  if (!v.right) card.append(node('p', null, `It was ${v.guilty.name}. ${v.because}`));
  else card.append(node('p', null, v.because));

  if (v.right && !v.earned) {
    card.append(node('p', 'sub', 'You never looked at:'));
    const ul = node('ul');
    for (const o of v.missing) ul.append(node('li', null, o.name));
    card.append(ul);
  }

  card.append(node('p', 'sub',
    `You found ${v.found.length} of the ${v.total} contradictions in this room.`));

  const again = node('button', 'btn', v.right ? 'LOOK AGAIN' : 'KEEP LOOKING');
  again.addEventListener('click', closeVeil);
  card.append(again);
}

/* ── go ──────────────────────────────────────────────────────────────────── */

layout();
render();

window.room = () => ({
  examined: [...game.examined], heard: [...game.heard],
  contradictions: game.contradictions().map((c) => c.claim),
  problems,
});
</script>
</body>
</html>

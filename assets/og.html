<!doctype html>
<meta charset="utf-8" />
<title>Playground — the social card, drawn from the front page</title>
<!--
  The picture a link to the site unfurls into (og.png, 1200×630).

  It used to be its own composition: a flow field and a headline, drawn here
  and nowhere else, so the card and the page it advertised were two designs
  that only agreed until one of them changed. It is now the front page itself,
  in a frame, with everything taken out that is not the corrected headline
  and the top of the contact sheet. Change the page and the card follows.

  To regenerate: serve the repo, open this file at exactly 1200×630, wait a
  few seconds for the pen to finish, and screenshot it to assets/og.png.
-->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f3efe5; }
  iframe { border: 0; width: 1200px; height: 630px; display: block; }
</style>
<iframe id="page" src="../index.html" scrolling="no" title="The front page"></iframe>
<script>
const frame = document.getElementById('page');
frame.addEventListener('load', () => {
  const doc = frame.contentDocument;
  const style = doc.createElement('style');
  style.textContent = `
    [data-navigator], nav.top a:not(.brand), .under .sub, .under .actions, .spec, .proof .foot,
    .crop.bl, .crop.br, .fig1 figcaption, #work { display: none !important; }
    .proof { min-height: 0 !important; padding-bottom: 0 !important; }
    .title { padding: 14px 12px 0 !important; }
    .byline { margin-bottom: 0 !important; }
    h1.headline { font-size: 86px !important; }
    .under { margin-top: 0 !important; grid-template-columns: 1fr 1fr !important; }
    .headline-note { margin: -8px 0 0 auto !important; }
    .fig1 { margin-top: 26px !important; }
  `;
  doc.head.append(style);
});
</script>

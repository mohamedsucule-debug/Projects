<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="../../favicon.svg" />
<meta name="theme-color" content="#06070d" />
<title>Morph — one gallery, seven layouts, no transitions anywhere</title>
<meta name="description" content="Switch between grid, masonry, justified rows, spiral, deck and coverflow and watch every tile fly to its new place. Drag to reorder, click to expand. Every movement is a spring, so you can interrupt any of it mid-flight." />
<meta property="og:title" content="Morph — one gallery, seven layouts, no transitions anywhere" />
<meta property="og:description" content="Switch between grid, masonry, justified rows, spiral, deck and coverflow and watch every tile fly to its new place. Drag to reorder, click to expand. Every movement is a spring, so you can interrupt any of it mid-flight." />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="../../shared/lab.css" />
<style>
  .work {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr);
    grid-template-areas: "rail stage";
    gap: 10px; padding: 10px 12px 12px; min-height: 0;
  }
  .rail { grid-area: rail; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .stagewrap { grid-area: stage; min-width: 0; }

  /* ── the stage ────────────────────────────────────────────── */
  .stagewrap {
    position: relative; overflow: auto; overscroll-behavior: contain;
    background: var(--ink-850); border: 1px solid var(--line);
    border-radius: var(--r-lg); min-height: 400px;
  }
  #field {
    position: relative; margin: 0 auto; padding: 0;
    /* the 3D layouts need a camera; without it rotateY is a flat squash */
    perspective: 1400px; transform-style: preserve-3d;
  }

  /* ── a tile ───────────────────────────────────────────────── */
  .tile {
    position: absolute; top: 0; left: 0;
    padding: 0; margin: 0; border: 0; background: var(--ink-700);
    border-radius: 10px; overflow: hidden; cursor: pointer;
    will-change: transform, width, height;
    box-shadow: 0 8px 22px -14px rgba(0,0,0,.9);
    /* transforms are written every frame; anything animated by CSS here would
       fight the spring loop for control of the same property */
    transition: none;
    contain: paint;
  }
  .tile canvas, .tile .ph {
    display: block; width: 100%; height: 100%; object-fit: cover;
    pointer-events: none; border-radius: inherit;
  }
  .tile .ph { background: linear-gradient(135deg, var(--ink-600), var(--ink-750)); }
  .tile .label {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 20px 12px 9px; text-align: left;
    font: 600 12px/1.2 var(--sans); color: #fff;
    background: linear-gradient(transparent, rgba(4,6,10,.82));
    opacity: 0; transition: opacity .16s; pointer-events: none;
  }
  .tile:hover .label, .tile:focus-visible .label, .tile.open .label { opacity: 1; }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .tile.dragging { cursor: grabbing; box-shadow: 0 30px 60px -20px rgba(0,0,0,.95); }
  .tile.open { cursor: zoom-out; }

  /* Inside #field, not beside it. #field carries `perspective`, which makes it
     a stacking context — so a tile's z-index is only ever compared against its
     siblings inside that context, and no value can lift it above an element
     outside. An earlier version had the scrim as a sibling of #field and the
     opened tile rendered behind it, fully dimmed. */
  .scrim {
    position: absolute; inset: 0; z-index: 400;
    background: color-mix(in oklab, var(--ink-900) 82%, transparent);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .22s;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }

  .caption {
    position: absolute; left: 50%; transform: translateX(-50%) translateY(10px);
    z-index: 600; max-width: min(520px, 88%);
    background: var(--ink-800); border: 1px solid var(--line-bright);
    border-radius: 12px; padding: 14px 18px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .caption.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .caption h3 { margin: 0 0 5px; font-size: 15px; letter-spacing: -.01em; }
  .caption p { margin: 0; font: 400 12.5px/1.55 var(--sans); color: var(--fg-dim); }

  /* ── controls ─────────────────────────────────────────────── */
  .layouts { display: grid; gap: 5px; }
  .layouts button {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    text-align: left; padding: 9px 11px; font-size: 12.5px;
  }
  .layouts button span { margin-left: auto; font: 400 10.5px/1 var(--mono); color: var(--fg-mute); }
  .layouts button[aria-pressed="true"] span { color: color-mix(in oklab, var(--accent) 75%, var(--fg)); }

  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 12px; }
  .presets button { justify-content: center; font-size: 11px; padding: 7px 3px; }

  .row { margin-bottom: 11px; }
  .row label {
    display: flex; align-items: baseline; gap: 8px;
    font: 500 11px/1 var(--sans); color: var(--fg-dim); margin-bottom: 5px;
  }
  .row label .v { margin-left: auto; font: 400 11px/1 var(--mono); color: var(--fg); }
  .row input[type=range] { width: 100%; display: block; }

  .readout {
    display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
    font: 400 10.5px/1.5 var(--mono); color: var(--fg-mute); padding-top: 4px;
  }
  .readout b { color: var(--fg-dim); font-weight: 400; }

  .note {
    font: 400 11.5px/1.55 var(--sans); color: var(--fg-mute);
    margin: 0; padding-top: 2px;
  }
  .note b { color: var(--fg-dim); font-weight: 600; }

  @media (max-width: 900px) {
    html, body { height: auto; overflow: visible; }
    .shell { height: auto; min-height: 100dvh; }
    .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "rail"; padding: 9px; }
    .stagewrap { min-height: 66vh; }
    .rail .panel > .body { overflow: visible; }
    .presets { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="bar">
    <a class="home" href="../../index.html">&larr; INDEX</a>
    <h1>Morph</h1>
    <span class="sub">seven layouts, no transitions anywhere</span>
    <span class="spacer"></span>
    <span class="hint" style="margin-right:8px">drag to reorder &nbsp; click to open &nbsp; <span class="kbd">1</span>–<span class="kbd">7</span> switch</span>
    <span id="explainSlot"></span>
    <button id="theme" class="mono ghost">&#9681; dark</button>
  </header>

  <div class="work">
    <aside class="rail">
      <div class="panel" style="flex:0 0 auto">
        <div class="head"><span>Layout</span></div>
        <div class="body"><div class="layouts" id="layouts"></div></div>
      </div>

      <div class="panel" style="flex:1 1 auto;min-height:150px">
        <div class="head"><span>The spring</span></div>
        <div class="body" style="overflow:auto">
          <div class="presets" id="presets"></div>
          <div id="springRows"></div>
          <p class="note" id="springNote"></p>
        </div>
      </div>

      <div class="panel" style="flex:0 0 auto">
        <div class="head"><span>The gallery</span></div>
        <div class="body">
          <div id="galleryRows"></div>
          <div class="readout" id="readout"></div>
        </div>
      </div>
    </aside>

    <div class="stagewrap" id="stagewrap">
      <div id="field"><div class="scrim" id="scrim"></div></div>
      <div class="caption" id="caption"><h3 id="capTitle"></h3><p id="capBody"></p></div>
    </div>
  </div>
</div>

<script type="module">
/* ───────────────────────────────────────────────────────────────────────────
   The interface.

   One idea runs through all of it: **a tile has a target rectangle, and a
   spring pulling it there.** Nothing else.

   Switching layout writes new targets. Dragging writes new targets for
   everything the dragged tile displaced. Opening a tile writes one enormous
   target for that tile. Closing it writes the old one back. There is no
   "expand animation" and no "reorder animation" anywhere in this file, because
   there is nothing left for them to do — the shared-element transition is what
   you get for free once every position is already a spring.

   That is also why every one of these is interruptible. Switch layout while
   the tiles are still flying, grab one mid-flight, hit escape halfway through
   an expand: the targets change and the springs carry their momentum into the
   new destination. Nothing restarts from a standstill, because nothing was
   ever following a plan it could lose its place in.
   ─────────────────────────────────────────────────────────────────────────── */

import {
  LAYOUTS, SPRINGS, criticalDamping, makeSpring, stepSpring, atRest, snapSpring,
  extent, reorder, slotAt,
} from './engine.js';
import { h, $, clamp, themeToggle, explainer, explainButton } from '../../shared/lab.js';

const field = $('#field'), stagewrap = $('#stagewrap');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

const P = {
  layout: 'masonry',
  count: 26,
  gap: 14,
  columns: 4,
  stiffness: SPRINGS.snappy.stiffness,
  damping: SPRINGS.snappy.damping,
};

const ASPECTS = [1, 1, 0.72, 1.5, 1.33, 0.8, 1.78, 1.1];
let items = [];          // { id, aspect, name, blurb, el, sp, art }
let opened = null;
let dragging = null;
let box = { width: 800, height: 600 };
let frames = [], lastFrameLog = 0, fps = 0;

/* ── building the tiles ──────────────────────────────────────────────────── */

const NAMES = [
  ['Magma', 'Noise pushed through a warp and a hot palette.'],
  ['Marble', 'Concentric rings shoved sideways by a noise field.'],
  ['Reef', 'Scattered cells outlined against their neighbours.'],
  ['Rose window', 'Noise folded back on itself eight times.'],
  ['Dunes', 'A gradient and a noise field argued into bands.'],
  ['Mosaic', 'One scatter of points read twice — tiles, then gaps.'],
];

function build() {
  // only the tiles — the scrim lives in here too and must survive a rebuild
  for (const old of field.querySelectorAll('.tile')) old.remove();
  items = Array.from({ length: P.count }, (_, i) => {
    const [name, blurb] = NAMES[i % NAMES.length];
    const el = h('button', {
      class: 'tile',
      type: 'button',
      'aria-label': `${name} — click to open`,
    }, h('div', { class: 'ph' }), h('span', { class: 'label' }, `${name} ${Math.floor(i / NAMES.length) + 1}`));
    field.append(el);
    return {
      id: i,
      aspect: ASPECTS[i % ASPECTS.length],
      name: `${name} ${Math.floor(i / NAMES.length) + 1}`,
      blurb,
      el,
      art: null,
      sp: {
        x: makeSpring(box.width / 2), y: makeSpring(120),
        w: makeSpring(10), h: makeSpring(10),
        rot: makeSpring(0), rotY: makeSpring(0), scale: makeSpring(1),
      },
      // a deterministic nudge per tile, so a layout change cascades rather
      // than arriving as one block. Still a spring — still interruptible.
      wobble: 1 + ((i * 37) % 11) / 44,
    };
  });
  layoutNow(true);
  paintArt();
}

/* ── the pictures ────────────────────────────────────────────────────────── */

/* Rendered by Loom's own engine rather than shipped as files: six graphs, one
   per idle slice, reused across the tiles. A tile shows a gradient until its
   picture arrives, which is what it would do on a slow connection anyway. */
async function paintArt() {
  try {
    const [loom, presets] = await Promise.all([import('../loom/engine.js'), import('../loom/presets.js')]);
    const SIZE = 260;
    const made = [];
    for (let i = 0; i < presets.PRESETS.length; i++) {
      await new Promise((r) => (window.requestIdleCallback || ((f) => setTimeout(f, 30)))(r));
      const g = loom.deserialize(structuredClone(presets.PRESETS[i].graph));
      const out = g.nodes.find((n) => n.type === 'output');
      const { image } = loom.evaluate(g, out.id, SIZE, SIZE);
      const c = document.createElement('canvas');
      c.width = c.height = SIZE;
      c.getContext('2d').putImageData(new ImageData(loom.toRGBA(image), SIZE, SIZE), 0, 0);
      made.push(c);
      // hand it to every tile that wants this picture, as it becomes available
      for (const it of items) {
        if (it.id % presets.PRESETS.length !== i || it.art) continue;
        const copy = document.createElement('canvas');
        copy.width = copy.height = SIZE;
        copy.getContext('2d').drawImage(c, 0, 0);
        it.el.querySelector('.ph')?.replaceWith(copy);
        it.art = copy;
      }
    }
  } catch { /* the gradients are a perfectly good fallback */ }
}

/* ── targets ─────────────────────────────────────────────────────────────── */

let targets = [];

function measure() {
  const r = stagewrap.getBoundingClientRect();
  const pad = 18;
  box = { width: Math.max(220, r.width - pad * 2), height: Math.max(260, r.height - pad * 2) };
  field.style.width = `${box.width}px`;
  field.style.padding = `${pad}px 0`;
}

function layoutNow(snap = false) {
  measure();
  const def = LAYOUTS[P.layout];
  const opts = {
    width: box.width, height: box.height,
    gap: P.gap, columns: P.columns,
    targetHeight: Math.max(110, box.width / 6),
    size: P.layout === 'deck' ? Math.min(300, box.width * 0.45)
        : P.layout === 'coverflow' ? Math.min(230, box.width * 0.3)
        : Math.min(110, box.width / 7),
    focus: Math.floor(items.length / 2),
  };
  targets = def.fn(items, opts);

  const needed = extent(targets);
  field.style.height = `${Math.max(box.height, needed)}px`;

  if (snap || reduced.matches) {
    items.forEach((it, i) => {
      const t = targets[i];
      snapSpring(it.sp.x, t.x); snapSpring(it.sp.y, t.y);
      snapSpring(it.sp.w, t.w); snapSpring(it.sp.h, t.h);
      snapSpring(it.sp.rot, t.rot || 0); snapSpring(it.sp.rotY, t.rotY || 0);
      snapSpring(it.sp.scale, t.scale ?? 1);
    });
    write();
  }
  kick();
  updateReadout();
}

/** Where a tile is actually being pulled: its slot, unless it is open or held. */
function targetFor(i) {
  const it = items[i];
  if (opened === it) {
    // fill the visible stage, keeping the picture's own proportions
    const maxW = box.width * 0.92, maxH = box.height * 0.92;
    const w = Math.min(maxW, maxH * it.aspect);
    const hgt = w / it.aspect;
    return {
      x: (box.width - w) / 2,
      y: stagewrap.scrollTop + (box.height - hgt) / 2,
      w, h: hgt, rot: 0, rotY: 0, scale: 1,
    };
  }
  if (dragging?.item === it) return dragging.rect;
  return targets[i];
}

/* ── the loop ────────────────────────────────────────────────────────────── */

let raf = null, last = 0;

function kick() {
  if (raf) return;
  last = performance.now();
  raf = requestAnimationFrame(tick);
}

function tick(now) {
  const dt = (now - last) / 1000;
  last = now;

  frames.push(now);
  while (frames.length > 40) frames.shift();
  if (frames.length > 8 && now - lastFrameLog > 400) {
    fps = Math.round((frames.length - 1) * 1000 / (frames[frames.length - 1] - frames[0]));
    lastFrameLog = now;
    updateReadout();
  }

  let moving = false;
  items.forEach((it, i) => {
    const t = targetFor(i);
    if (!t) return;
    const cfg = { stiffness: P.stiffness * it.wobble, damping: P.damping, mass: 1 };
    const pairs = [
      [it.sp.x, t.x], [it.sp.y, t.y], [it.sp.w, t.w], [it.sp.h, t.h],
      [it.sp.rot, t.rot || 0], [it.sp.rotY, t.rotY || 0], [it.sp.scale, t.scale ?? 1],
    ];
    for (const [s, target] of pairs) {
      if (atRest(s, target, 0.08)) { snapSpring(s, target); continue; }
      stepSpring(s, target, cfg, dt);
      moving = true;
    }
  });

  write();
  if (moving) raf = requestAnimationFrame(tick);
  else { raf = null; updateReadout(); }
}

function write() {
  for (const it of items) {
    const { x, y, w, h, rot, rotY, scale } = it.sp;
    const el = it.el;
    /* Position, rotation and scale go through transform — the compositor
       handles those without touching layout. Width and height cannot; they
       are real layout. That is affordable here only because every tile is
       absolutely positioned, so resizing one can never reflow its siblings.
       At a few thousand tiles this would be the wrong trade and the sizes
       would have to be faked with a scale plus a counter-scaled child. */
    el.style.width = `${w.value}px`;
    el.style.height = `${h.value}px`;
    el.style.transform =
      `translate3d(${x.value}px, ${y.value}px, 0)` +
      (rotY.value ? ` rotateY(${rotY.value}deg)` : '') +
      (rot.value ? ` rotate(${rot.value}deg)` : '') +
      (scale.value !== 1 ? ` scale(${scale.value})` : '');
  }
}

/* ── opening one ─────────────────────────────────────────────────────────── */

function open(it) {
  opened = it;
  for (const other of items) other.el.classList.toggle('open', other === it);
  it.el.style.zIndex = 500;
  $('#scrim').classList.add('on');
  $('#capTitle').textContent = it.name;
  $('#capBody').textContent = it.blurb;

  /* The stage is a scroll container, so anything absolutely positioned in it
     scrolls away with the content. Lock the scroll while a tile is open — the
     usual lightbox behaviour — and place the caption against the part of the
     stage that is actually visible. */
  const cap = $('#caption');
  const top = stagewrap.scrollTop;
  stagewrap.style.overflow = 'hidden';
  cap.classList.add('on');
  // measured rather than guessed: the blurb wraps to a different number of
  // lines per tile, and a fixed offset clipped the taller ones off the bottom
  cap.style.top = `${top + box.height - cap.offsetHeight + 4}px`;
  kick();
}

function close() {
  if (!opened) return;
  const was = opened;
  opened = null;
  was.el.classList.remove('open');
  // the z-index has to outlast the journey home, or the tile ducks behind its
  // neighbours the instant it starts moving
  setTimeout(() => { if (opened !== was) was.el.style.zIndex = ''; }, 650);
  $('#scrim').classList.remove('on');
  $('#caption').classList.remove('on');
  stagewrap.style.overflow = '';
  kick();
}

$('#scrim').addEventListener('click', close);
addEventListener('keydown', (e) => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
  if (e.key === 'Escape') return close();
  const n = Number(e.key);
  if (n >= 1 && n <= Object.keys(LAYOUTS).length) setLayout(Object.keys(LAYOUTS)[n - 1]);
});

/* ── dragging ────────────────────────────────────────────────────────────── */

const DRAG_START = 5;   // px of movement before a press becomes a drag

field.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.tile');
  if (!el || opened) return;
  const index = items.findIndex((it) => it.el === el);
  if (index < 0) return;
  const it = items[index];
  const r = targets[index];
  el.setPointerCapture(e.pointerId);
  dragging = {
    item: it, index, started: false,
    sx: e.clientX, sy: e.clientY,
    grabX: e.clientX - r.x, grabY: e.clientY - r.y,
    rect: { ...r },
  };
});

field.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  if (!dragging.started) {
    if (Math.hypot(e.clientX - dragging.sx, e.clientY - dragging.sy) < DRAG_START) return;
    dragging.started = true;
    dragging.item.el.classList.add('dragging');
    dragging.item.el.style.zIndex = 300;
  }
  const fieldBox = field.getBoundingClientRect();
  dragging.rect = {
    ...dragging.rect,
    x: e.clientX - dragging.grabX,
    y: e.clientY - dragging.grabY,
    rot: 0, rotY: 0, scale: 1.04,
  };

  // where would it land? recompute only when the answer actually changes
  const px = e.clientX - fieldBox.left, py = e.clientY - fieldBox.top;
  const over = slotAt(targets, px, py, dragging.index);
  if (over >= 0 && over !== dragging.index) {
    items = reorder(items, dragging.index, over);
    dragging.index = over;
    layoutNow();
  }
  kick();
});

const endDrag = () => {
  if (!dragging) return;
  const { item } = dragging;
  item.el.classList.remove('dragging');
  setTimeout(() => { if (!dragging && opened !== item) item.el.style.zIndex = ''; }, 500);
  const wasDrag = dragging.started;
  dragging = null;
  kick();
  return wasDrag;
};

field.addEventListener('pointerup', (e) => {
  const el = e.target.closest('.tile');
  const wasDrag = endDrag();
  if (!wasDrag && el) {
    const it = items.find((x) => x.el === el);
    if (it) (opened === it ? close() : open(it));
  }
});
field.addEventListener('pointercancel', endDrag);

/* clicking is also pressing Enter on a focused tile */
field.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('.tile');
  if (!el) return;
  e.preventDefault();
  const it = items.find((x) => x.el === el);
  if (it) (opened === it ? close() : open(it));
});

/* ── the panels ──────────────────────────────────────────────────────────── */

const layoutBox = $('#layouts');
for (const [key, def] of Object.entries(LAYOUTS)) {
  layoutBox.append(h('button', {
    data: { layout: key },
    'aria-pressed': key === P.layout,
    onClick: () => setLayout(key),
  }, def.label, h('span', {}, def.note)));
}
function setLayout(key) {
  if (!LAYOUTS[key]) return;
  P.layout = key;
  for (const b of layoutBox.children) b.setAttribute('aria-pressed', b.dataset.layout === key);
  if (opened) close();
  layoutNow();
}

const presetBox = $('#presets');
for (const [name, cfg] of Object.entries(SPRINGS)) {
  presetBox.append(h('button', {
    onClick: () => { P.stiffness = cfg.stiffness; P.damping = cfg.damping; buildSprings(); kick(); },
  }, name));
}

const slider = (key, label, min, max, step, onDone, fmt = (v) => v) => {
  const out = h('span', { class: 'v' }, fmt(P[key]));
  return h('div', { class: 'row' },
    h('label', {}, label, out),
    h('input', {
      type: 'range', min, max, step, value: P[key],
      onInput: (e) => { P[key] = +e.target.value; out.textContent = fmt(P[key]); onDone(); },
    }));
};

function buildSprings() {
  $('#springRows').replaceChildren(
    slider('stiffness', 'Stiffness', 30, 900, 10, () => { springNote(); kick(); }, (v) => String(Math.round(v))),
    slider('damping', 'Damping', 4, 60, 1, () => { springNote(); kick(); }, (v) => String(Math.round(v))));
  springNote();
}

function springNote() {
  const crit = criticalDamping({ stiffness: P.stiffness });
  const ratio = P.damping / crit;
  const verdict = ratio < 0.92
    ? `<b>Under-damped.</b> It will overshoot and come back — bouncy, and easy to overdo.`
    : ratio > 1.15
      ? `<b>Over-damped.</b> It eases in and never passes the target — calm, and can feel sluggish.`
      : `<b>About critically damped.</b> The fastest it can arrive without overshooting at all.`;
  $('#springNote').innerHTML =
    `${verdict} Critical damping here would be <b>${crit.toFixed(0)}</b>.`;
}

function buildGallery() {
  $('#galleryRows').replaceChildren(
    slider('count', 'How many tiles', 4, 90, 1, () => { build(); }, (v) => String(Math.round(v))),
    slider('columns', 'Columns', 1, 8, 1, () => layoutNow(), (v) => String(Math.round(v))),
    slider('gap', 'Gap', 0, 40, 1, () => layoutNow(), (v) => `${Math.round(v)}px`));
}

function updateReadout() {
  $('#readout').replaceChildren(
    h('span', {}, h('b', {}, items.length), ' tiles'),
    h('span', {}, '·'),
    h('span', {}, h('b', {}, raf ? `${fps || '–'} fps` : 'at rest')));
}

/* ── the briefing ────────────────────────────────────────────────────────── */

const panel = explainer({
  key: 'morph',
  title: 'Morph',
  tagline: 'One gallery, seven layouts, and not a single CSS transition.',
  sections: [
    {
      h: 'In one sentence',
      p: 'Every tile has a rectangle it is being pulled towards, and changing where things go is the only thing any of these buttons do.',
    },
    {
      h: 'Try this',
      p: [
        'Switch layout, and then <b>switch again before the tiles land</b>. They do not stop and restart — they bend into the new arrangement carrying the speed they already had.',
        'Then grab a tile mid-flight while everything is still moving, and drop it somewhere else. Then set the spring to <b>wobbly</b> and do it again.',
      ],
    },
    {
      h: 'Why not a CSS transition',
      p: [
        'A transition is a promise about the future: <i>get from here to there over 300ms along this curve</i>. Interrupt it and the browser has to throw the promise away and make a new one starting from wherever the element happens to be — at <b>zero velocity</b>. Things stop dead and set off again. You can see it, and it is the most common single reason an interface feels cheap.',
        'A spring has no idea where it started or when it is due. It knows its position, its velocity, and where it is being pulled. Change the target and nothing is discarded: the pull turns and the momentum carries through. That is the whole difference, and it is why every one of these gestures can be interrupted by any other.',
      ],
    },
    {
      h: 'The bit that surprised me',
      p: 'There is no expand animation in this. Opening a tile writes one very large target rectangle for it; closing writes the old one back. The shared-element transition — where the tile itself grows into the detail view rather than a copy fading in over the top — is not implemented anywhere. It falls out for free the moment every position is already a spring.',
    },
    {
      h: 'The layouts are real algorithms',
      p: [
        '<b>Justified</b> is the one every photo site uses and none of them explain. Fill a row at a rough height, then solve for the exact height that makes it fill the container: <code>(width − gaps) ÷ sum of aspect ratios</code>. Every item keeps its own proportions, the widths come out right, and the row closes to the pixel. A test asserts every row lands within 0.02px of the edge.',
        '<b>Masonry</b> drops each tile into whichever column is currently shortest. Packing these perfectly is NP-hard; the greedy answer lands within a few percent and runs in one pass.',
        '<b>Spiral</b> turns 137.5° between tiles — the angle a sunflower uses. Being irrational, no two tiles ever line up into a spoke however many you add.',
      ],
    },
    {
      h: 'What it does not do',
      p: [
        'Tile sizes are animated as real width and height, which is layout work rather than pure compositing. That is affordable only because every tile is absolutely positioned, so resizing one can never reflow its neighbours. At a few thousand tiles this would be the wrong trade and the sizes would have to be faked with a scale and a counter-scaled child.',
        'There is no virtualisation: every tile is a real element whether it is on screen or not. Push the count to ninety and watch the frame counter — that is the honest cost.',
        'If your system is set to reduce motion, all of this snaps instead. The springs are still there; they are just told to arrive immediately.',
      ],
    },
  ],
});
$('#explainSlot').append(explainButton(panel));

/* ── go ──────────────────────────────────────────────────────────────────── */

themeToggle($('#theme'));
buildSprings();
buildGallery();
measure();
build();

let resizeRaf = null;
new ResizeObserver(() => {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => layoutNow());
}).observe(stagewrap);
reduced.addEventListener?.('change', () => layoutNow(true));
</script>
<script type="module" src="../../shared/navigator.js"></script>

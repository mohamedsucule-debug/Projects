<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="../../favicon.svg" />
<meta name="theme-color" content="#0a0e1a" />
<title>Tangle — a knot a day</title>
<meta name="description" content="Tap a tile to turn it. The board is solved when no connector is left dangling. Everybody in the world gets the same board each day." />
<meta property="og:title" content="Tangle — a knot a day" />
<meta property="og:description" content="Turn the tiles until nothing is left dangling. Same board for everyone, every day." />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: #0a0e1a;
    color: #e8edf8;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #shell {
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 72px 16px 28px;
  }
  .head { text-align: center; }
  .head h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .head p { margin: 5px 0 0; font-size: 13.5px; color: rgba(232,237,248,.5); }
  canvas { display: block; touch-action: manipulation; cursor: pointer; border-radius: 16px; }
  .stats {
    display: flex; gap: 20px; font: 600 12.5px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: rgba(232,237,248,.45); letter-spacing: .06em;
  }
  .stats b { color: rgba(232,237,248,.9); font-weight: 700; }
  .done { text-align: center; max-width: 420px; }
  .done h2 { margin: 0 0 6px; font-size: 21px; font-weight: 800; }
  .done p { margin: 0 0 14px; font-size: 13.5px; color: rgba(232,237,248,.55); line-height: 1.5; }
  .row { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }
  /* A class that sets `display` outruns the browser's own [hidden] rule, so
     hiding .row by setting el.hidden quietly did nothing at all. */
  [hidden] { display: none !important; }
  button.act {
    border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06);
    color: #e8edf8; border-radius: 10px; padding: 10px 16px;
    font: 650 13px/1 "Inter", system-ui, sans-serif; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button.act:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.28); }
  button.act.primary { background: #4ea8ff; border-color: #4ea8ff; color: #05101f; }
  button.act.primary:hover { background: #77bcff; }
  .back {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    padding: 8px 12px; border-radius: 10px;
    background: rgba(9,13,26,.5); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.14);
    color: rgba(255,255,255,.72); text-decoration: none;
    font: 600 11.5px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .07em;
    opacity: .5; transition: opacity .15s;
  }
  .back:hover { opacity: 1; }
  @media (max-width: 480px) { #shell { padding-top: 60px; gap: 14px; } .head h1 { font-size: 22px; } }
</style>
</head>
<body>
<a class="back" href="../../index.html">&larr; INDEX</a>
<div id="shell">
  <div class="head">
    <h1 id="title">Tangle</h1>
    <p id="sub">tap a tile to turn it · nothing left dangling wins</p>
  </div>
  <canvas id="c"></canvas>
  <div class="stats">
    <span>TURNS <b id="moves">0</b></span>
    <span>PAR <b id="par">0</b></span>
    <span>LOOSE <b id="loose">0</b></span>
    <span id="clockWrap">TIME <b id="clock">0:00</b></span>
  </div>
  <div class="done" id="done" hidden>
    <h2 id="doneTitle">Untangled</h2>
    <p id="doneLine"></p>
    <div class="row">
      <button class="act primary" id="copy" type="button">Copy result</button>
      <button class="act" id="again" type="button">Another one</button>
    </div>
  </div>
  <div class="row" id="idleRow">
    <button class="act" id="practice" type="button">Random board</button>
  </div>
</div>

<script type="module">
/* ───────────────────────────────────────────────────────────────────────────
   Tangle — the part you can see.

   The rules are in engine.js. Here: tiles that turn rather than jump, a pulse
   that runs through a connected run of pipe the moment it joins up, and a
   wave that sweeps the whole board when the last connector lands.

   The turning is the important one. Snapping a tile to its new angle is one
   line shorter and it makes the board unreadable — you lose track of which
   piece you just touched, and with it any sense that the thing responded to
   you. Ninety milliseconds of rotation is the difference between a grid of
   numbers and something you want to keep touching.
   ─────────────────────────────────────────────────────────────────────────── */

import { Puzzle, DIRS, dayNumber, share, store, rotate } from './engine.js';

const COLS = 6, ROWS = 6;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const el = (id) => document.getElementById(id);
const day = dayNumber();

let puzzle, isDaily = true, cell = 64, elapsed = 0, finished = false;
let spin = [];            // per tile: how much of a turn is still to be played out
let joy = [];             // per tile: a fading highlight when it becomes connected
let wave = -1;            // solve animation, in cells of radius

function boardFor(daily) {
  isDaily = daily;
  puzzle = new Puzzle({ cols: COLS, rows: ROWS, seed: daily ? day : ((Math.random() * 1e9) | 0) });
  spin = new Float32Array(puzzle.tiles.length);
  joy = new Float32Array(puzzle.tiles.length);
  wave = -1;
  elapsed = 0; finished = false;
  el('done').hidden = true;
  el('idleRow').hidden = false;
  el('title').textContent = daily ? `Tangle #${day}` : 'Tangle · random board';
  el('sub').textContent = daily
    ? 'the same board for everyone, today'
    : 'a board of your own · come back tomorrow for the daily one';
  el('par').textContent = puzzle.par;
  paintStats();
}

function paintStats() {
  el('moves').textContent = puzzle.moves;
  el('loose').textContent = puzzle.loose;
  el('clock').textContent = clock(elapsed);
}

const clock = (s) => `${(s / 60) | 0}:${String(Math.floor(s) % 60).padStart(2, '0')}`;

/* ── layout ──────────────────────────────────────────────────────────────── */

function fit() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const avail = Math.min(innerWidth - 32, innerHeight - 290, 560);
  cell = Math.max(38, Math.floor(avail / COLS));
  const w = cell * COLS, h = cell * ROWS;
  canvas.style.width = `${w}px`;
  canvas.style.height = `${h}px`;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', fit);

/* ── input ───────────────────────────────────────────────────────────────── */

canvas.addEventListener('pointerdown', (e) => {
  if (puzzle.solved) return;
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / cell);
  const y = Math.floor((e.clientY - r.top) / cell);
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  const i = y * COLS + x;
  const before = connectedSet();
  puzzle.turn(i);
  spin[i] += Math.PI / 2;           // it is already turned; this plays the turn out
  const after = connectedSet();
  // light up anything that just joined up, which is the only feedback you need
  for (let k = 0; k < after.length; k++) if (after[k] && !before[k]) joy[k] = 1;
  paintStats();
  if (puzzle.solved) win();
});

el('practice').addEventListener('click', () => { boardFor(false); fit(); });
el('again').addEventListener('click', () => { boardFor(false); fit(); });
el('copy').addEventListener('click', async () => {
  const text = share({
    day, moves: puzzle.moves, par: puzzle.par, seconds: elapsed,
    url: 'https://mohamedsucule-debug.github.io/Projects/play/tangle/',
  });
  const btn = el('copy');
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = 'Copied';
  } catch {
    /* clipboard access is refused often enough — over http, in an iframe, on a
       browser that wants a different gesture — that failing silently would
       lose somebody their result. Show it and let them take it. */
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'width:100%;height:82px;margin-top:10px;background:#0f1424;color:#e8edf8;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px;font:12px ui-monospace,monospace';
    ta.readOnly = true;
    el('done').append(ta);
    ta.select();
    btn.textContent = 'Select and copy';
  }
  setTimeout(() => { btn.textContent = 'Copy result'; }, 2400);
});

/* ── what counts as joined up ────────────────────────────────────────────── */

function connectedSet() {
  const { cols, rows, tiles } = puzzle;
  const ok = new Uint8Array(tiles.length);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x, m = tiles[i];
      let good = m !== 0;
      for (const d of DIRS) {
        if (!(m & d.bit)) continue;
        const nx = x + d.dx, ny = y + d.dy;
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) { good = false; break; }
        if (!(tiles[ny * cols + nx] & d.opp)) { good = false; break; }
      }
      ok[i] = good ? 1 : 0;
    }
  }
  return ok;
}

function win() {
  finished = true;
  wave = 0;
  const result = { moves: puzzle.moves, par: puzzle.par, seconds: Math.round(elapsed) };
  let streak = 0;
  if (isDaily) streak = store.finish(day, result);
  el('idleRow').hidden = true;
  el('done').hidden = false;
  el('doneTitle').textContent = puzzle.moves <= puzzle.par ? 'Untangled, perfectly' : 'Untangled';
  el('doneLine').textContent = isDaily
    ? `${puzzle.moves} turns against a par of ${puzzle.par}, in ${clock(elapsed)}.`
      + (streak > 1 ? ` That is ${streak} days in a row.` : '')
    : `${puzzle.moves} turns against a par of ${puzzle.par}, in ${clock(elapsed)}.`;
  el('copy').hidden = !isDaily;
}

/* ── drawing ─────────────────────────────────────────────────────────────── */

const LIT = '#5fb8ff', DIM = '#47506b', GLOW = '#9ee6ff';

function drawTile(i, x, y, mask, lit, extra) {
  const s = cell, c = s / 2;
  const px = x * s, py = y * s;
  ctx.save();
  ctx.translate(px + c, py + c);
  ctx.rotate(-spin[i]);               // spin counts down the turn still owed

  const arm = c * 0.98;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(4, s * 0.15);
  ctx.strokeStyle = lit ? LIT : DIM;
  if (lit) { ctx.shadowColor = GLOW; ctx.shadowBlur = 8 + extra * 18; }

  const ends = [];
  if (mask & 1) ends.push([0, -arm]);
  if (mask & 2) ends.push([arm, 0]);
  if (mask & 4) ends.push([0, arm]);
  if (mask & 8) ends.push([-arm, 0]);

  if (ends.length === 2 && ends[0][0] + ends[1][0] === 0 && ends[0][1] + ends[1][1] === 0) {
    // a straight run: one stroke, not two meeting in the middle
    ctx.beginPath();
    ctx.moveTo(ends[0][0], ends[0][1]);
    ctx.lineTo(ends[1][0], ends[1][1]);
    ctx.stroke();
  } else {
    for (const [ex, ey] of ends) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }
    if (ends.length !== 1) {
      ctx.beginPath();
      ctx.arc(0, 0, ctx.lineWidth * 0.5, 0, 6.2832);
      ctx.fillStyle = lit ? LIT : DIM;
      ctx.fill();
    }
  }

  // a stub gets a cap, so a loose end looks like a loose end rather than a bug
  if (ends.length === 1) {
    ctx.beginPath();
    ctx.arc(0, 0, ctx.lineWidth * 0.82, 0, 6.2832);
    ctx.fillStyle = lit ? LIT : DIM;
    ctx.fill();
  }
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!finished && puzzle.moves > 0) {
    const whole = Math.floor(elapsed);
    elapsed += dt;
    if (Math.floor(elapsed) !== whole) el('clock').textContent = clock(elapsed);
  }

  const speed = reduced ? 1e9 : 11;
  for (let i = 0; i < spin.length; i++) {
    if (spin[i] > 0) spin[i] = Math.max(0, spin[i] - dt * speed);
    if (joy[i] > 0) joy[i] = Math.max(0, joy[i] - dt * 1.6);
  }
  if (wave >= 0) wave += dt * 9;

  const w = cell * COLS, h = cell * ROWS;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0d1223';
  roundRect(0, 0, w, h, 16);
  ctx.fill();

  // the faintest grid, so a tile reads as a tile you can touch
  ctx.strokeStyle = 'rgba(255,255,255,.035)';
  ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * cell, 6); ctx.lineTo(x * cell, h - 6); ctx.stroke(); }
  for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(6, y * cell); ctx.lineTo(w - 6, y * cell); ctx.stroke(); }

  const ok = connectedSet();
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = y * COLS + x;
      let extra = joy[i];
      if (wave >= 0) {
        // a band sweeping out from the top-left corner on the last move
        const d = x + y;
        extra = Math.max(extra, Math.max(0, 1 - Math.abs(wave - d) * 0.7));
      }
      drawTile(i, x, y, puzzle.tiles[i], ok[i] === 1, extra);
    }
  }
  if (wave > COLS + ROWS + 4) wave = -1;

  requestAnimationFrame(frame);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* If today is already done, say so rather than making them solve it twice. */
boardFor(true);
fit();
const already = store.done(day);
if (already) {
  el('sub').textContent = `you finished today's in ${already.moves} turns · here it is again`;
}
requestAnimationFrame(frame);
window.tanglePuzzle = () => puzzle;   // the seam a headless browser plays through
</script>
</body>
</html>

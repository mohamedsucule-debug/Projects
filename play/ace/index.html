<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="../../favicon.svg" />
<meta name="theme-color" content="#1b2340" />
<title>Ace — fly a paper plane through a canyon</title>
<meta name="description" content="Tap to fly. Do not hit the rocks. A small arcade game that runs in your browser with nothing to install." />
<meta property="og:title" content="Ace — fly a paper plane through a canyon" />
<meta property="og:description" content="Tap to fly. Do not hit the rocks. That is the whole game." />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 12%, #1c2442 0%, #0b1020 55%, #070a16 100%);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* a double-tap on a phone must not zoom the page instead of flying */
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    display: block; touch-action: none; cursor: pointer;
    border-radius: 14px;
    /* the playfield is narrower than a wide monitor, so it gets a frame and
       reads as a screen rather than as a page that failed to fill */
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.07);
  }

  /* the only chrome on the whole page */
  .back {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 10px;
    background: rgba(9,13,26,.5); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.14);
    color: rgba(255,255,255,.72); text-decoration: none;
    font: 600 11.5px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .07em;
    opacity: .55; transition: opacity .15s, color .15s;
  }
  .back:hover { opacity: 1; color: #fff; }

  .sound {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    width: 38px; height: 38px; border-radius: 10px;
    background: rgba(9,13,26,.5); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.14);
    color: rgba(255,255,255,.72); cursor: pointer;
    font-size: 15px; line-height: 1;
    opacity: .55; transition: opacity .15s;
  }
  .sound:hover { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { .back, .sound { transition: none; } }
</style>
</head>
<body>

<a class="back" href="../../index.html">&larr; INDEX</a>
<button class="sound" id="sound" type="button" aria-label="Mute">&#128266;</button>
<div id="wrap"><canvas id="c"></canvas></div>

<script type="module">
/* ───────────────────────────────────────────────────────────────────────────
   Ace — the part you can see.

   The rules live in engine.js and know nothing about any of this. Here: a
   canvas, some parallax, a few particles, and four synthesised noises.

   The whole interface is one instruction, and the game gives it to you on the
   first screen: tap. There is no menu, no difficulty select, no settings
   panel, no tutorial and no dialog in the way. If a game needs to be explained
   it has already failed, and every control in a settings panel is a decision
   somebody has to make before they are allowed to have any fun.
   ─────────────────────────────────────────────────────────────────────────── */

import { Game, STATE, RULES, best } from './engine.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

/* The world is a fixed height in game units and a width that follows the
   window, so the physics is identical everywhere and a wide screen simply
   shows more sky. Tuning the game once, in units, beats tuning it per device. */
const WORLD_H = 620;
let scale = 1, game = new Game({ width: 620, height: WORLD_H });
let bestScore = best.get(), fresh = true;

function fit() {
  const vw = innerWidth, vh = innerHeight;
  const dpr = Math.min(2, devicePixelRatio || 1);
  scale = vh / WORLD_H;
  /* Capped deliberately. Left to fill a wide monitor the playfield becomes a
     letterbox with acres of empty sky, the rocks arrive from a long way off
     and the game gets easier the bigger your screen is. A fixed-ish window,
     centred, is both fairer and reads as something built on purpose. */
  const worldW = Math.max(400, Math.min(760, vw / scale));
  canvas.style.width = `${Math.round(worldW * scale)}px`;
  canvas.style.height = `${Math.round(WORLD_H * scale)}px`;
  canvas.width = Math.round(worldW * scale * dpr);
  canvas.height = Math.round(WORLD_H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  game.resize(worldW, WORLD_H);
}
addEventListener('resize', fit);

/* ── sound ───────────────────────────────────────────────────────────────────
   Four noises, all generated. No files, so nothing to load and nothing to go
   missing. The context is created on the first tap because every browser
   refuses to start audio before one. */

let audio = null, muted = false;
try { muted = localStorage.getItem('ace.muted') === '1'; } catch {}
const soundBtn = document.getElementById('sound');
const paintSound = () => { soundBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; };
paintSound();
soundBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  paintSound();
  try { localStorage.setItem('ace.muted', muted ? '1' : '0'); } catch {}
});

function beep({ freq = 440, to = freq, dur = 0.1, type = 'sine', gain = 0.16, noise = false }) {
  if (muted) return;
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    const g = audio.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(audio.destination);

    let src;
    if (noise) {
      const buf = audio.createBuffer(1, audio.sampleRate * dur, audio.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      src = audio.createBufferSource();
      src.buffer = buf;
    } else {
      src = audio.createOscillator();
      src.type = type;
      src.frequency.setValueAtTime(freq, t);
      src.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    }
    src.connect(g);
    src.start(t);
    src.stop(t + dur + 0.02);
  } catch { /* no audio is not a reason to stop the game */ }
}

const sfx = {
  flap: () => beep({ freq: 620, to: 300, dur: 0.09, type: 'triangle', gain: 0.1 }),
  point: () => beep({ freq: 880, to: 1320, dur: 0.1, type: 'square', gain: 0.07 }),
  star: () => beep({ freq: 1180, to: 1760, dur: 0.16, type: 'sine', gain: 0.11 }),
  crash: () => { beep({ dur: 0.34, gain: 0.22, noise: true }); beep({ freq: 180, to: 44, dur: 0.4, type: 'sawtooth', gain: 0.14 }); },
};

/* ── input ───────────────────────────────────────────────────────────────── */

let shake = 0, flash = 0, restartAt = 0;
const puffs = [], bits = [], pops = [];

function tap() {
  if (game.state === STATE.DEAD) {
    // a short lockout, or the tap that killed you also restarts you and the
    // crash is never actually seen
    if (performance.now() < restartAt) return;
    bestScore = Math.max(bestScore, game.score);
    best.set(game.score);
    game.reset();
    bits.length = 0; puffs.length = 0; pops.length = 0;
    return;
  }
  if (game.state === STATE.READY) fresh = false;
  game.flap();
  sfx.flap();
  puff(true);
}

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); tap(); });
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); tap(); }
});

/* ── little bits of stuff ────────────────────────────────────────────────── */

function puff(strong = false) {
  const p = game.plane;
  puffs.push({
    x: p.x - 16, y: p.y + 6,
    vx: -40 - Math.random() * 30, vy: (Math.random() - 0.5) * 22,
    r: strong ? 6 + Math.random() * 4 : 3, life: 1,
  });
  if (puffs.length > 90) puffs.shift();
}

function burst(x, y) {
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 260;
    bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 1, r: 2 + Math.random() * 3 });
  }
}

/* ── drawing ─────────────────────────────────────────────────────────────── */

const SKY = [['#1b2340', 0], ['#46335c', 0.42], ['#b2596a', 0.72], ['#f0a06a', 0.9], ['#ffd6a0', 1]];

function hills(offset, y, h, colour, step, amp, seedPhase) {
  const w = game.width;
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.moveTo(-40, WORLD_H);
  for (let x = -40; x <= w + 40; x += 8) {
    const t = (x + offset) / step;
    const yy = y + Math.sin(t + seedPhase) * amp + Math.sin(t * 2.3 + seedPhase * 1.7) * amp * 0.4;
    ctx.lineTo(x, yy);
  }
  ctx.lineTo(w + 40, WORLD_H);
  ctx.closePath();
  ctx.fill();
}

function drawPlane(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  // a paper dart: two folded halves, the lower one shaded
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(-16, -12); ctx.lineTo(-8, 0); ctx.closePath();
  ctx.fillStyle = '#fdfdfb'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(-16, 12); ctx.lineTo(-8, 0); ctx.closePath();
  ctx.fillStyle = '#cfd6e6'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(-8, 0);
  ctx.strokeStyle = 'rgba(40,48,70,.45)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();
}

function drawRock(bar, top) {
  const grad = ctx.createLinearGradient(bar.x, 0, bar.x + bar.w, 0);
  grad.addColorStop(0, '#20141f');
  grad.addColorStop(0.42, '#3c2434');
  grad.addColorStop(1, '#150c16');
  ctx.fillStyle = grad;
  const r = 9;
  const y = top ? bar.y : bar.y;
  ctx.beginPath();
  if (top) {
    ctx.moveTo(bar.x, y);
    ctx.lineTo(bar.x + bar.w, y);
    ctx.lineTo(bar.x + bar.w, y + bar.h - r);
    ctx.quadraticCurveTo(bar.x + bar.w, y + bar.h, bar.x + bar.w - r, y + bar.h);
    ctx.lineTo(bar.x + r, y + bar.h);
    ctx.quadraticCurveTo(bar.x, y + bar.h, bar.x, y + bar.h - r);
  } else {
    ctx.moveTo(bar.x, y + r);
    ctx.quadraticCurveTo(bar.x, y, bar.x + r, y);
    ctx.lineTo(bar.x + bar.w - r, y);
    ctx.quadraticCurveTo(bar.x + bar.w, y, bar.x + bar.w, y + r);
    ctx.lineTo(bar.x + bar.w, y + bar.h);
    ctx.lineTo(bar.x, y + bar.h);
  }
  ctx.closePath();
  ctx.fill();
  // a lit edge on the side the sun is on
  // a warm rim on the sunward edge and a hard dark lip on the other, so a
  // rock separates from the hills behind it at a glance
  ctx.fillStyle = 'rgba(255,196,142,.30)';
  ctx.fillRect(bar.x, bar.y, 3.5, bar.h);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(bar.x + bar.w - 3, bar.y, 3, bar.h);
}

function text(str, x, y, { size = 20, weight = 700, colour = '#fff', align = 'center', shadow = true } = {}) {
  ctx.font = `${weight} ${size}px "Inter", ui-sans-serif, system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) {
    ctx.fillStyle = 'rgba(10,12,24,.45)';
    ctx.fillText(str, x, y + size * 0.07);
  }
  ctx.fillStyle = colour;
  ctx.fillText(str, x, y);
}

function draw(now) {
  const W = game.width;

  ctx.save();
  if (shake > 0.01) {
    ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  }

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, WORLD_H);
  for (const [c, at] of SKY) sky.addColorStop(at, c);
  ctx.fillStyle = sky;
  ctx.fillRect(-30, -30, W + 60, WORLD_H + 60);

  // sun
  const sunX = W * 0.74, sunY = WORLD_H * 0.62;
  const glow = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 190);
  glow.addColorStop(0, 'rgba(255,225,170,.95)');
  glow.addColorStop(0.18, 'rgba(255,190,130,.38)');
  glow.addColorStop(1, 'rgba(255,170,110,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(sunX - 200, sunY - 200, 400, 400);

  // parallax, each layer moving at its own fraction of the scroll
  const d = game.distance;
  hills(d * 0.055, WORLD_H * 0.60, 0, 'rgba(78,52,86,.55)', 150, 26, 0);
  hills(d * 0.14, WORLD_H * 0.70, 0, 'rgba(56,36,64,.75)', 96, 20, 2.1);
  hills(d * 0.30, WORLD_H * 0.82, 0, 'rgba(36,23,44,.9)', 62, 15, 4.7);

  // rocks
  for (const rock of game.rocks) {
    if (rock.x > W + 60 || rock.x < -80) continue;
    for (const [i, bar] of game.bars(rock).entries()) drawRock(bar, i === 0);
    if (rock.star && !rock.starTaken) {
      const t = now / 420 + rock.x * 0.01;
      ctx.save();
      ctx.translate(rock.x + RULES.rockW / 2, rock.gapY);
      ctx.rotate(Math.sin(t) * 0.3);
      const s = 1 + Math.sin(t * 1.6) * 0.08;
      ctx.scale(s, s);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        const r = i % 2 ? 6.5 : 15;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fillStyle = '#ffd766';
      ctx.shadowColor = 'rgba(255,215,102,.85)';
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.restore();
    }
  }

  // smoke trail
  for (const p of puffs) {
    ctx.globalAlpha = p.life * 0.4;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (1.6 - p.life * 0.6), 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (game.state !== STATE.DEAD || game.deadFor < 3) drawPlane(game.plane);

  // crash confetti
  for (const b of bits) {
    ctx.globalAlpha = Math.max(0, b.life);
    ctx.fillStyle = b.life > 0.5 ? '#fff3d0' : '#e5a76a';
    ctx.fillRect(b.x, b.y, b.r, b.r);
  }
  ctx.globalAlpha = 1;

  // score pops
  for (const p of pops) {
    ctx.globalAlpha = Math.max(0, p.life);
    text(p.txt, p.x, p.y, { size: 20, colour: p.colour });
  }
  ctx.globalAlpha = 1;

  // ── the only text on screen
  if (game.state === STATE.FLYING || game.state === STATE.DEAD) {
    text(String(game.score), W / 2, 62, { size: 54, weight: 800 });
  }

  if (game.state === STATE.READY) {
    const bob = Math.sin(now / 420) * 4;
    text('Ace', W / 2, WORLD_H * 0.22, { size: 52, weight: 800 });
    text('tap to fly', W / 2, WORLD_H * 0.22 + 46, { size: 17, weight: 600, colour: 'rgba(255,255,255,.82)' });
    text('don’t hit the rocks', W / 2, WORLD_H * 0.22 + 72, { size: 14, weight: 500, colour: 'rgba(255,255,255,.55)' });
    if (bestScore > 0) {
      text(`best  ${bestScore}`, W / 2, WORLD_H - 46, { size: 14, weight: 600, colour: 'rgba(255,255,255,.5)' });
    }
    /* A ring that pulses out from the plane. An earlier version put a small
       grey triangle in the middle of the sky, which pointed at nothing and
       explained nothing — the hint has to be attached to the thing the
       instruction is about. */
    const pulse = (now / 900) % 1;
    ctx.strokeStyle = `rgba(255,255,255,${0.45 * (1 - pulse)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(game.plane.x, game.plane.y + bob * 0.25, 24 + pulse * 30, 0, 6.2832);
    ctx.stroke();
  }

  if (game.state === STATE.DEAD && game.deadFor > 0.45) {
    ctx.fillStyle = 'rgba(8,10,22,.52)';
    ctx.fillRect(-30, -30, W + 60, WORLD_H + 60);
    const isBest = game.score > 0 && game.score >= bestScore;
    text(isBest ? 'best yet' : 'down you go', W / 2, WORLD_H * 0.36, { size: 30, weight: 800, colour: isBest ? '#ffd766' : '#fff' });
    text(String(game.score), W / 2, WORLD_H * 0.36 + 62, { size: 66, weight: 800 });
    text(`best  ${Math.max(bestScore, game.score)}`, W / 2, WORLD_H * 0.36 + 112,
      { size: 15, weight: 600, colour: 'rgba(255,255,255,.62)' });
    if (performance.now() >= restartAt) {
      ctx.globalAlpha = 0.65 + Math.sin(now / 380) * 0.25;
      text('tap to go again', W / 2, WORLD_H * 0.36 + 162, { size: 16, weight: 600 });
      ctx.globalAlpha = 1;
    }
  }

  ctx.restore();

  if (flash > 0.01) {
    ctx.fillStyle = `rgba(255,236,210,${flash * 0.5})`;
    ctx.fillRect(-30, -30, W + 60, WORLD_H + 60);
  }
}

/* ── the loop ────────────────────────────────────────────────────────────── */

let last = performance.now(), trailTimer = 0;
let prevScore = 0, prevStars = 0;

function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;

  const wasAlive = game.state !== STATE.DEAD;
  game.step(dt);

  // sounds and confetti come from watching the engine, not from being told by
  // it — the engine has no idea any of this exists
  if (game.score !== prevScore) {
    if (game.stars !== prevStars) {
      sfx.star();
      pops.push({ txt: '+1', x: game.plane.x + 30, y: game.plane.y - 20, life: 1, colour: '#ffd766' });
    } else {
      sfx.point();
    }
    prevScore = game.score; prevStars = game.stars;
  }
  if (wasAlive && game.state === STATE.DEAD) {
    sfx.crash();
    burst(game.plane.x, game.plane.y);
    shake = 1; flash = 1;
    restartAt = performance.now() + 620;
    prevScore = 0; prevStars = 0;
  }

  if (game.state === STATE.FLYING) {
    trailTimer += dt;
    while (trailTimer > 0.045) { trailTimer -= 0.045; puff(); }
  }

  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.5;
    if (p.life <= 0) puffs.splice(i, 1);
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.vy += 900 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt * 0.75;
    if (b.life <= 0) bits.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.y -= 42 * dt; p.life -= dt * 1.4;
    if (p.life <= 0) pops.splice(i, 1);
  }

  shake = Math.max(0, shake - dt * 3.2);
  flash = Math.max(0, flash - dt * 4);

  draw(now);
  requestAnimationFrame(frame);
}

fit();
requestAnimationFrame(frame);
</script>
</body>
</html>

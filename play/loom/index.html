<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="../../favicon.svg" />
<meta name="theme-color" content="#06070d" />
<title>Loom — build a picture by wiring boxes together</title>
<meta name="description" content="A node-based image studio in the browser. Wire noise into warps into palettes, watch every box update live, and take the result away as a PNG. No plugins, no install." />
<link rel="stylesheet" href="../../shared/lab.css" />
<style>
  /* ── layout ───────────────────────────────────────────────── */
  /* Explicit areas rather than implicit placement. An earlier version let the
     stage auto-place and pinned the right rail to row 2 by hand; at phone
     width both landed in the same cell and the result panel sat on top of the
     graph. Naming every region makes that impossible. */
  .work {
    display: grid;
    grid-template-columns: 186px minmax(0, 1fr) 316px;
    grid-template-areas: "left stage right";
    gap: 9px;
    padding: 9px 11px 11px;
    min-height: 0;
  }
  .rail.left { grid-area: left; }
  .stage { grid-area: stage; }
  .rail.right { grid-area: right; }
  .rail { display: flex; flex-direction: column; gap: 9px; min-height: 0; }
  .rail .panel { min-height: 0; }
  .scrolly { overflow: auto; }

  /* ── the palette ──────────────────────────────────────────── */
  .catlabel {
    font: 700 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--fg-ghost); margin: 12px 2px 6px;
  }
  .catlabel:first-child { margin-top: 2px; }
  .addbtn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    text-align: left; font-size: 12.5px; padding: 7px 9px; margin-bottom: 3px;
    background: transparent; border-color: transparent;
  }
  .addbtn:hover { background: var(--ink-700); }
  .addbtn i { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  .presetgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .presetgrid button {
    font-size: 11.5px; padding: 8px 4px; justify-content: center;
  }

  /* ── the graph stage ──────────────────────────────────────── */
  .stage {
    position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, var(--line-bright) 1px, transparent 0) 0 0 / 22px 22px,
      var(--ink-850);
    border: 1px solid var(--line); border-radius: var(--r-lg);
    min-height: 340px;
    touch-action: none;
    cursor: grab;
  }
  .stage.panning { cursor: grabbing; }
  .stage canvas.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .world { position: absolute; inset: 0; transform-origin: 0 0; }

  .node {
    position: absolute; width: 124px;
    background: var(--ink-800);
    border: 1px solid var(--line-bright);
    border-radius: 9px;
    box-shadow: 0 10px 26px -14px rgba(0,0,0,.9);
    user-select: none;
  }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 14px 30px -14px rgba(0,0,0,.95); }
  .node .nhead {
    display: flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 8px; cursor: grab;
    border-bottom: 1px solid var(--line);
    font: 600 11px/1 var(--sans); letter-spacing: -.005em;
    white-space: nowrap; overflow: hidden;
  }
  .node.drag .nhead { cursor: grabbing; }
  .node .nhead i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .node canvas.nthumb {
    display: block; width: 108px; height: 108px; margin: 8px;
    border-radius: 5px; background: var(--ink-900);
    image-rendering: auto;
  }
  .node.out { border-color: color-mix(in oklab, var(--accent) 55%, var(--line-bright)); }

  .port {
    position: absolute; width: 11px; height: 11px; border-radius: 50%;
    background: var(--ink-700); border: 1.5px solid var(--line-bright);
    cursor: crosshair; z-index: 3;
  }
  /* the dot is small but the grab area is not — a 22px invisible pad around it */
  .port::after { content: ''; position: absolute; inset: -7px; border-radius: 50%; }
  .port:hover, .port.hot { background: var(--accent); border-color: var(--accent); transform: scale(1.18); }
  .port.filled { background: var(--fg-mute); }
  .pin { left: -6px; }
  .pout { right: -6px; top: 50%; margin-top: 6px; }

  .stage .emptyhint[hidden] { display: none; }
  .stage .emptyhint {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 400 13px/1.6 var(--sans); color: var(--fg-ghost); text-align: center;
    pointer-events: none; padding: 30px;
  }

  /* ── the preview ──────────────────────────────────────────── */
  .previewbox { position: relative; }
  .previewbox canvas {
    display: block; width: 100%; aspect-ratio: 1; border-radius: var(--r);
    background: var(--ink-900); image-rendering: auto;
  }
  .stat {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    font: 400 10.5px/1.5 var(--mono); color: var(--fg-mute);
    padding: 8px 2px 0;
  }
  .stat b { color: var(--fg-dim); font-weight: 400; }

  /* ── parameters ───────────────────────────────────────────── */
  .paramhead { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .paramhead i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .paramhead h4 { margin: 0; font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; }
  .paramabout { font: 400 12px/1.55 var(--sans); color: var(--fg-mute); margin: 0 0 12px; }

  .row { margin-bottom: 11px; }
  .row label {
    display: flex; align-items: baseline; gap: 8px;
    font: 500 11px/1 var(--sans); color: var(--fg-dim); margin-bottom: 5px;
  }
  .row label .v { margin-left: auto; font: 400 11px/1 var(--mono); color: var(--fg); }
  .row input[type=range] { width: 100%; display: block; }
  .row select { width: 100%; font-size: 12px; }
  .row.check label { margin: 0; cursor: pointer; }
  .row.check input { margin-right: 7px; }

  .nothing { font: 400 12.5px/1.6 var(--sans); color: var(--fg-ghost); padding: 6px 2px; }

  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .acts button { justify-content: center; font-size: 12px; padding: 9px 6px; }
  .acts .wide { grid-column: 1 / -1; }
  .acts .primary { background: var(--accent); color: var(--ink-900); border-color: transparent; font-weight: 650; }
  .acts .primary:hover { filter: brightness(1.1); background: var(--accent); color: var(--ink-900); }

  .sizerow { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .sizerow select { flex: 1; font-size: 12px; }
  .sizerow span { font: 400 10.5px/1 var(--mono); color: var(--fg-mute); }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(10px);
    background: var(--ink-750); border: 1px solid var(--line-bright); border-radius: 99px;
    padding: 9px 18px; font: 500 12.5px/1 var(--sans); color: var(--fg);
    box-shadow: 0 18px 40px -18px rgba(0,0,0,.9);
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 120;
  }
  .toast.in { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── narrow screens ───────────────────────────────────────── */
  @media (max-width: 1080px) {
    .work {
      grid-template-columns: 158px minmax(0, 1fr);
      grid-template-areas: "left stage" "right right";
    }
    .rail.right { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
    .rail.right > .panel { flex: 1 1 260px; }
  }

  /* On a phone the rails stop being containers at all, so their panels become
     grid items in their own right and can be ordered individually: pick a
     preset, see the picture, then the graph underneath it. */
  @media (max-width: 720px) {
    /* The shared shell pins itself to one viewport height, which is right for
       a side-by-side desktop tool and wrong here: six stacked panels cannot
       share one screen, and squeezing them leaves every list clipped to a
       sliver. On a phone the page just scrolls. */
    html, body { height: auto; overflow: visible; }
    .shell { height: auto; min-height: 100dvh; }
    .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: none; padding: 8px; }
    .work .panel > .body:not(.scrolly) { overflow: visible; }
    .rail { display: contents; }
    .rail.left, .stage, .rail.right { grid-area: auto; }
    #panelPresets  { order: 1; }
    #panelResult   { order: 2; }
    .stage         { order: 3; min-height: 320px; }
    #panelSettings { order: 4; }
    #panelPalette  { order: 5; }
    #panelExport   { order: 6; }
    #panelPalette .scrolly { max-height: 210px; overflow: auto; }
    #panelSettings { max-height: 300px; }
    .bar .hint { display: none; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="bar">
    <a class="home" href="../../index.html">&larr; INDEX</a>
    <h1>Loom</h1>
    <span class="sub">wire boxes together, get a picture</span>
    <span class="spacer"></span>
    <span class="hint" style="margin-right:8px">
      drag a <span class="kbd">dot</span> to wire &nbsp; <span class="kbd">del</span> remove &nbsp; <span class="kbd">⌘Z</span> undo
    </span>
    <span id="explainSlot"></span>
    <button id="theme" class="mono ghost">&#9681; dark</button>
  </header>

  <div class="work">

    <aside class="rail left">
      <div class="panel" id="panelPresets" style="flex:0 0 auto">
        <div class="head"><span>Start here</span></div>
        <div class="body">
          <div class="presetgrid" id="presets"></div>
          <button class="addbtn" id="shuffle" style="margin-top:7px;justify-content:center;border-color:var(--line-bright)">
            &#9850; Shuffle it
          </button>
        </div>
      </div>
      <div class="panel" id="panelPalette" style="flex:1 1 auto">
        <div class="head"><span>Add a box</span></div>
        <div class="body scrolly" id="palette"></div>
      </div>
    </aside>

    <div class="stage" id="stage">
      <canvas class="wires" id="wires"></canvas>
      <div class="world" id="world"></div>
      <div class="emptyhint" id="emptyhint" hidden>
        Nothing here yet.<br />Add a box from the left, or load one of the examples.
      </div>
    </div>

    <aside class="rail right">
      <div class="panel" id="panelResult" style="flex:0 0 auto">
        <div class="head"><span>Result</span><span class="spacer"></span><span class="mute mono" style="font-size:10px" id="outname">output</span></div>
        <div class="body">
          <div class="previewbox"><canvas id="preview" width="352" height="352"></canvas></div>
          <div class="stat" id="stat"></div>
        </div>
      </div>

      <div class="panel" id="panelSettings" style="flex:1 1 auto;min-height:150px">
        <div class="head"><span>Settings</span></div>
        <div class="body scrolly" id="params"></div>
      </div>

      <div class="panel" id="panelExport" style="flex:0 0 auto">
        <div class="head"><span>Take it with you</span></div>
        <div class="body">
          <div class="sizerow">
            <span>SIZE</span>
            <select id="exportSize">
              <option value="512">512 × 512</option>
              <option value="1024" selected>1024 × 1024</option>
              <option value="2048">2048 × 2048</option>
            </select>
          </div>
          <div class="acts">
            <button class="primary wide" id="save">&#8595; Save PNG</button>
            <button id="share">&#128279; Copy link</button>
            <button id="tidy">&#8862; Tidy up</button>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
/* ───────────────────────────────────────────────────────────────────────────
   The editor.

   Everything that decides what a picture looks like lives in engine.js. This
   file only deals with the parts a person touches: where the boxes sit, which
   dot you dragged onto which other dot, and getting pixels onto a screen
   quickly enough that a slider feels attached to the image.

   Two decisions worth naming.

   The boxes are real DOM elements; only the wires are drawn on a canvas. Ports
   then get hover states, focus rings and generous touch targets for free,
   instead of me reimplementing hit-testing on a canvas and getting it subtly
   wrong on phones.

   Dragging a slider renders at half resolution and releasing it renders at
   full. Combined with the engine's cache — which only recomputes the boxes
   downstream of whatever changed — that is the difference between a control
   that feels connected to the picture and one that feels like a form.
   ─────────────────────────────────────────────────────────────────────────── */

import {
  NODES, evaluate, makeNode, connect, disconnect, removeNode,
  serialize, deserialize, toRGBA, GraphError, nodeById, inputOf,
} from './engine.js';
import { PRESETS, STARTER, autoLayout } from './presets.js';
import { h, $, clamp, themeToggle, explainer, explainButton } from '../../shared/lab.js';

const NODE_W = 124, HEAD_H = 26, THUMB = 108, PAD = 8;
const NODE_H = HEAD_H + PAD + THUMB + PAD;
const FULL = 352, DRAFT = 176;

const stage = $('#stage'), world = $('#world'), wires = $('#wires');
const preview = $('#preview'), pctx = preview.getContext('2d', { alpha: false });
const paramsBox = $('#params'), statLine = $('#stat');

/* ── state ───────────────────────────────────────────────────────────────── */

let graph = deserialize(structuredClone(STARTER));
let selected = null;
let view = { x: 0, y: 0, z: 1 };
const cache = new Map();
const els = new Map();          // node id -> { root, thumb, ctx, ports }
const lastSig = new Map();      // node id -> signature of what its thumbnail shows
const undoStack = [], redoStack = [];

let dirty = true, wantDraft = false, wiresDirty = true;
let scratch = null, scratchCtx = null, rgba = null, imgData = null, scratchRes = 0;

/* ── helpers ─────────────────────────────────────────────────────────────── */

const outputNode = () => graph.nodes.find((n) => n.type === 'output');

const portY = (count, i) => HEAD_H + (NODE_H - HEAD_H) * (i + 1) / (count + 1);

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('in');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('in'), 1700);
}

function snapshot() {
  undoStack.push(JSON.stringify(serialize(graph)));
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
}

function restore(json) {
  graph = deserialize(JSON.parse(json));
  if (selected && !nodeById(graph, selected)) selected = null;
  rebuild();
}

/* ── the picture ─────────────────────────────────────────────────────────── */

function ensureScratch(res) {
  if (scratchRes === res) return;
  scratch = document.createElement('canvas');
  scratch.width = scratch.height = res;
  scratchCtx = scratch.getContext('2d', { alpha: false });
  rgba = new Uint8ClampedArray(res * res * 4);
  imgData = new ImageData(rgba, res, res);
  scratchRes = res;
}

function render(res) {
  const out = outputNode();
  $('#emptyhint').hidden = graph.nodes.length > 0;
  if (!out) { statLine.textContent = 'no output box — add one to see a picture'; return; }

  ensureScratch(res);
  const t0 = performance.now();
  let result;
  try {
    result = evaluate(graph, out.id, res, res, cache);
  } catch (e) {
    statLine.textContent = e instanceof GraphError ? e.message : 'could not render';
    return;
  }
  const ms = performance.now() - t0;

  /* the cache holds an image per distinct node-state; without a ceiling a long
     session of slider-dragging would quietly eat a few hundred megabytes */
  if (cache.size > 220) cache.clear();

  if (preview.width !== res) { preview.width = preview.height = res; }
  toRGBA(result.image, rgba);
  pctx.putImageData(imgData, 0, 0);

  // thumbnails, but only the ones whose contents actually moved
  for (const [id, img] of result.results) {
    const el = els.get(id);
    if (!el) continue;
    const sig = `${res}:${result.order.indexOf(id)}:${sigOf(result, id)}`;
    if (lastSig.get(id) === sig) continue;
    lastSig.set(id, sig);
    toRGBA(img, rgba);
    scratchCtx.putImageData(imgData, 0, 0);
    el.ctx.clearRect(0, 0, THUMB, THUMB);
    el.ctx.drawImage(scratch, 0, 0, THUMB, THUMB);
  }

  statLine.replaceChildren(
    h('span', {}, h('b', {}, graph.nodes.length), ' boxes'),
    h('span', {}, '·'),
    h('span', {}, h('b', {}, `${res}px`)),
    h('span', {}, '·'),
    result.computed
      ? h('span', {}, 'redrew ', h('b', {}, result.computed), ' in ', h('b', {}, `${ms.toFixed(0)}ms`))
      : h('span', {}, 'all ', h('b', {}, 'cached')));
}

/* A node's rendered identity, for deciding whether its thumbnail is stale.
   Cheap stand-in: the engine already cached by signature, so the object
   identity of the returned image is a perfectly good proxy. */
const thumbIds = new WeakMap();
let thumbCounter = 0;
function sigOf(result, id) {
  const img = result.results.get(id);
  if (!thumbIds.has(img)) thumbIds.set(img, ++thumbCounter);
  return thumbIds.get(img);
}

function schedule({ draft = false, wires: w = false } = {}) {
  dirty = true;
  wantDraft = draft;
  if (w) wiresDirty = true;
}

function loop() {
  if (dirty) { dirty = false; render(wantDraft ? DRAFT : FULL); }
  if (wiresDirty) { wiresDirty = false; drawWires(); }
  requestAnimationFrame(loop);
}

/* ── wires ───────────────────────────────────────────────────────────────── */

let pendingWire = null;   // { fromId, x, y } while a wire is being dragged

function drawWires() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (wires.width !== Math.round(r.width * dpr)) {
    wires.width = Math.round(r.width * dpr);
    wires.height = Math.round(r.height * dpr);
  }
  const ctx = wires.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.setTransform(dpr * view.z, 0, 0, dpr * view.z, view.x * dpr, view.y * dpr);
  ctx.lineCap = 'round';

  for (const l of graph.links) {
    const a = nodeById(graph, l.from), b = nodeById(graph, l.to);
    if (!a || !b) continue;
    const n = NODES[b.type].inputs.length;
    const x1 = a.x + NODE_W, y1 = a.y + HEAD_H + (NODE_H - HEAD_H) / 2;
    const x2 = b.x, y2 = b.y + portY(n, l.port);
    const live = selected && (l.from === selected || l.to === selected);
    ctx.strokeStyle = live ? (NODES[a.type].accent || '#7dd3fc') : 'rgba(158,180,212,.55)';
    ctx.lineWidth = live ? 2.6 / view.z : 2 / view.z;
    curve(ctx, x1, y1, x2, y2);
  }

  if (pendingWire) {
    const a = nodeById(graph, pendingWire.fromId);
    if (a) {
      ctx.strokeStyle = NODES[a.type].accent || '#7dd3fc';
      ctx.lineWidth = 2.2 / view.z;
      ctx.setLineDash([6 / view.z, 5 / view.z]);
      curve(ctx, a.x + NODE_W, a.y + HEAD_H + (NODE_H - HEAD_H) / 2, pendingWire.x, pendingWire.y);
      ctx.setLineDash([]);
    }
  }
}

function curve(ctx, x1, y1, x2, y2) {
  // the control points lean out horizontally in proportion to the gap, so a
  // short hop stays tight and a long one sweeps rather than kinking
  const d = Math.max(26, Math.min(140, Math.abs(x2 - x1) * 0.6));
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(x1 + d, y1, x2 - d, y2, x2, y2);
  ctx.stroke();
}

/* ── building the boxes ──────────────────────────────────────────────────── */

function rebuild() {
  world.replaceChildren();
  els.clear();
  lastSig.clear();
  for (const n of graph.nodes) world.append(buildNode(n));
  applyView();
  schedule({ wires: true });
  showParams();
}

function buildNode(n) {
  const def = NODES[n.type];
  const thumb = h('canvas', { class: 'nthumb', width: THUMB, height: THUMB });
  const root = h('div', {
    class: `node${n.type === 'output' ? ' out' : ''}${selected === n.id ? ' sel' : ''}`,
    style: { left: `${n.x}px`, top: `${n.y}px` },
    data: { id: n.id },
  },
    h('div', { class: 'nhead' }, h('i', { style: { background: def.accent } }), def.title),
    thumb);

  def.inputs.forEach((name, i) => {
    root.append(h('b', {
      class: 'port pin', title: `${name} in`,
      style: { top: `${portY(def.inputs.length, i) - 5.5}px` },
      data: { port: String(i) },
    }));
  });
  if (n.type !== 'output') root.append(h('b', { class: 'port pout', title: 'out', data: { out: '1' } }));

  els.set(n.id, { root, thumb, ctx: thumb.getContext('2d') });
  return root;
}

function refreshPortFill() {
  for (const n of graph.nodes) {
    const el = els.get(n.id);
    if (!el) continue;
    el.root.querySelectorAll('.pin').forEach((p) => {
      p.classList.toggle('filled', inputOf(graph, n.id, +p.dataset.port) != null);
    });
  }
}

function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
}

function select(id) {
  selected = id;
  for (const [nid, el] of els) el.root.classList.toggle('sel', nid === id);
  showParams();
  schedule({ wires: true });
}

/* ── the settings panel ──────────────────────────────────────────────────── */

function showParams() {
  const n = selected && nodeById(graph, selected);
  if (!n) {
    paramsBox.replaceChildren(h('p', { class: 'nothing' },
      'Click a box to change what it does. Drag from the dot on its right edge to the dot on another box to wire them together.'));
    return;
  }
  const def = NODES[n.type];
  const rows = [
    h('div', { class: 'paramhead' }, h('i', { style: { background: def.accent } }), h('h4', {}, def.title)),
    h('p', { class: 'paramabout' }, def.about),
  ];

  for (const spec of def.params) {
    if (spec.kind === 'num') {
      const out = h('span', { class: 'v' }, fmtVal(n.params[spec.key]));
      const input = h('input', {
        type: 'range', min: spec.min, max: spec.max, step: spec.step, value: n.params[spec.key],
        onInput: (e) => {
          n.params[spec.key] = +e.target.value;
          out.textContent = fmtVal(+e.target.value);
          schedule({ draft: true });
        },
        onChange: () => schedule(),
        onPointerdown: () => snapshot(),
      });
      rows.push(h('div', { class: 'row' }, h('label', {}, spec.label, out), input));
    } else if (spec.kind === 'pick') {
      rows.push(h('div', { class: 'row' },
        h('label', {}, spec.label),
        h('select', {
          onChange: (e) => { snapshot(); n.params[spec.key] = e.target.value; schedule(); },
        }, spec.options.map((o) => h('option', { value: o, selected: n.params[spec.key] === o }, o)))));
    } else if (spec.kind === 'bool') {
      rows.push(h('div', { class: 'row check' },
        h('label', {},
          h('input', {
            type: 'checkbox', checked: !!n.params[spec.key],
            onChange: (e) => { snapshot(); n.params[spec.key] = e.target.checked; schedule(); },
          }), spec.label)));
    }
  }

  if (n.type !== 'output') {
    rows.push(h('div', { class: 'acts', style: { marginTop: '14px' } },
      h('button', { class: 'wide', onClick: () => deleteNode(n.id) }, '✕ Remove this box')));
  }
  paramsBox.replaceChildren(...rows);
}

const fmtVal = (v) => (typeof v === 'number' ? (Number.isInteger(v) ? String(v) : v.toFixed(2)) : String(v));

/* ── mutations ───────────────────────────────────────────────────────────── */

function addNode(type) {
  snapshot();
  // drop it in the middle of whatever the person is currently looking at
  const r = stage.getBoundingClientRect();
  const cx = (r.width / 2 - view.x) / view.z - NODE_W / 2;
  const cy = (r.height / 2 - view.y) / view.z - NODE_H / 2;
  const n = makeNode(type, Math.round(cx + (Math.random() * 40 - 20)), Math.round(cy + (Math.random() * 40 - 20)));
  graph = { ...graph, nodes: [...graph.nodes, n] };
  selected = n.id;
  rebuild();
  refreshPortFill();
}

function deleteNode(id) {
  const n = nodeById(graph, id);
  if (!n || n.type === 'output') { toast('the output box has to stay'); return; }
  snapshot();
  graph = removeNode(graph, id);
  if (selected === id) selected = null;
  rebuild();
  refreshPortFill();
}

function link(from, to, port) {
  try {
    snapshot();
    graph = connect(graph, from, to, port);
    refreshPortFill();
    schedule({ wires: true });
  } catch (e) {
    undoStack.pop();
    toast(e instanceof GraphError ? e.message : 'cannot connect those');
  }
}

function loadGraph(data, { quiet = false } = {}) {
  try {
    snapshot();
    graph = deserialize(structuredClone(data));
    cache.clear();
    selected = null;
    rebuild();
    refreshPortFill();
    fitView();
  } catch (e) {
    undoStack.pop();
    if (!quiet) toast('that graph could not be read');
  }
}

/* ── pointer plumbing ────────────────────────────────────────────────────── */

let drag = null;

stage.addEventListener('pointerdown', (e) => {
  const portEl = e.target.closest('.port');
  const nodeEl = e.target.closest('.node');

  if (portEl && nodeEl) {
    const id = nodeEl.dataset.id;
    e.preventDefault();
    stage.setPointerCapture(e.pointerId);
    if (portEl.dataset.out) {
      drag = { kind: 'wire', fromId: id };
      pendingWire = { fromId: id, ...toGraph(e) };
    } else {
      const port = +portEl.dataset.port;
      const existing = inputOf(graph, id, port);
      if (existing) {
        // grabbing a filled input picks the wire back up rather than
        // silently doing nothing — the behaviour every node editor has
        snapshot();
        graph = disconnect(graph, id, port);
        drag = { kind: 'wire', fromId: existing };
        pendingWire = { fromId: existing, ...toGraph(e) };
        refreshPortFill();
      }
    }
    schedule({ wires: true });
    return;
  }

  if (nodeEl) {
    const id = nodeEl.dataset.id;
    select(id);
    if (e.target.closest('.nhead')) {
      const n = nodeById(graph, id);
      snapshot();
      stage.setPointerCapture(e.pointerId);
      nodeEl.classList.add('drag');
      drag = { kind: 'node', id, el: nodeEl, dx: n.x - toGraph(e).x, dy: n.y - toGraph(e).y };
    }
    return;
  }

  select(null);
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('panning');
  drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
});

stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (drag.kind === 'pan') {
    view.x = drag.ox + (e.clientX - drag.sx);
    view.y = drag.oy + (e.clientY - drag.sy);
    applyView();
    schedule({ wires: true });
  } else if (drag.kind === 'node') {
    const p = toGraph(e);
    const n = nodeById(graph, drag.id);
    n.x = Math.round(p.x + drag.dx);
    n.y = Math.round(p.y + drag.dy);
    drag.el.style.left = `${n.x}px`;
    drag.el.style.top = `${n.y}px`;
    schedule({ wires: true });
  } else if (drag.kind === 'wire') {
    pendingWire = { fromId: drag.fromId, ...toGraph(e) };
    const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.port');
    document.querySelectorAll('.port.hot').forEach((p) => p.classList.remove('hot'));
    if (over && over.classList.contains('pin')) over.classList.add('hot');
    schedule({ wires: true });
  }
});

stage.addEventListener('pointerup', (e) => {
  if (!drag) return;
  if (drag.kind === 'wire') {
    const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.port.pin');
    const nodeEl = over?.closest('.node');
    if (over && nodeEl) link(drag.fromId, nodeEl.dataset.id, +over.dataset.port);
    pendingWire = null;
    document.querySelectorAll('.port.hot').forEach((p) => p.classList.remove('hot'));
  }
  if (drag.kind === 'node') drag.el.classList.remove('drag');
  stage.classList.remove('panning');
  drag = null;
  schedule({ wires: true });
});
stage.addEventListener('pointercancel', () => {
  if (drag?.kind === 'node') drag.el.classList.remove('drag');
  pendingWire = null; drag = null; stage.classList.remove('panning');
  schedule({ wires: true });
});

stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const nz = clamp(view.z * (e.deltaY < 0 ? 1.12 : 1 / 1.12), 0.32, 2.2);
  // keep whatever is under the cursor under the cursor
  view.x = mx - (mx - view.x) * (nz / view.z);
  view.y = my - (my - view.y) * (nz / view.z);
  view.z = nz;
  applyView();
  schedule({ wires: true });
}, { passive: false });

function toGraph(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left - view.x) / view.z, y: (e.clientY - r.top - view.y) / view.z };
}

function fitView() {
  if (!graph.nodes.length) return;
  const r = stage.getBoundingClientRect();
  const minX = Math.min(...graph.nodes.map((n) => n.x));
  const maxX = Math.max(...graph.nodes.map((n) => n.x + NODE_W));
  const minY = Math.min(...graph.nodes.map((n) => n.y));
  const maxY = Math.max(...graph.nodes.map((n) => n.y + NODE_H));
  const pad = 34;
  const z = clamp(Math.min((r.width - pad * 2) / (maxX - minX), (r.height - pad * 2) / (maxY - minY)), 0.32, 1);
  view.z = z;
  view.x = (r.width - (maxX - minX) * z) / 2 - minX * z;
  view.y = (r.height - (maxY - minY) * z) / 2 - minY * z;
  applyView();
  schedule({ wires: true });
}

/* ── keyboard ────────────────────────────────────────────────────────────── */

addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  const meta = e.metaKey || e.ctrlKey;
  if (meta && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) {
      const j = redoStack.pop();
      if (j) { undoStack.push(JSON.stringify(serialize(graph))); restore(j); }
    } else {
      const j = undoStack.pop();
      if (j) { redoStack.push(JSON.stringify(serialize(graph))); restore(j); }
    }
    refreshPortFill();
  } else if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
    e.preventDefault();
    deleteNode(selected);
  } else if (e.key === 'f') {
    fitView();
  }
});

/* ── panels ──────────────────────────────────────────────────────────────── */

const CATS = [
  ['source', 'Make something'],
  ['shape', 'Change its shape'],
  ['mix', 'Combine two'],
  ['colour', 'Make it colourful'],
];
const palette = $('#palette');
for (const [cat, label] of CATS) {
  palette.append(h('div', { class: 'catlabel' }, label));
  for (const [type, def] of Object.entries(NODES)) {
    if (def.cat !== cat) continue;
    palette.append(h('button', { class: 'addbtn', title: def.about, onClick: () => addNode(type) },
      h('i', { style: { background: def.accent } }), def.title));
  }
}

const presetBox = $('#presets');
for (const p of PRESETS) {
  presetBox.append(h('button', { title: p.blurb, onClick: () => { loadGraph(p.graph); toast(p.name); } }, p.name));
}

/* Shuffle: reseed everything that has a seed and roll new palettes. It is the
   button for people who do not want to learn what any of this does, and it is
   the one most people press first. */
$('#shuffle').addEventListener('click', () => {
  snapshot();
  const names = NODES.colorize.params.find((p) => p.key === 'palette').options;
  for (const n of graph.nodes) {
    for (const spec of NODES[n.type].params) {
      if (spec.key === 'seed') n.params.seed = 1 + Math.floor(Math.random() * 9998);
      if (spec.key === 'palette') n.params.palette = names[Math.floor(Math.random() * names.length)];
      if (spec.key === 'shift') n.params.shift = Math.random();
    }
  }
  cache.clear();
  lastSig.clear();
  schedule();
  showParams();
});

$('#tidy').addEventListener('click', () => {
  snapshot();
  autoLayout(graph.nodes, graph.links);
  for (const n of graph.nodes) {
    const el = els.get(n.id);
    if (el) { el.root.style.left = `${n.x}px`; el.root.style.top = `${n.y}px`; }
  }
  fitView();
});

$('#save').addEventListener('click', async () => {
  const out = outputNode();
  if (!out) return toast('nothing to save');
  const size = +$('#exportSize').value;
  toast(`rendering ${size}×${size}…`);
  // let the toast paint before the main thread disappears for a second
  await new Promise((r) => setTimeout(r, 30));
  try {
    const { image: img } = evaluate(graph, out.id, size, size, new Map());
    const c = document.createElement('canvas');
    c.width = c.height = size;
    c.getContext('2d').putImageData(new ImageData(toRGBA(img), size, size), 0, 0);
    c.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: `loom-${Date.now().toString(36)}.png` });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('saved');
    }, 'image/png');
  } catch {
    toast('could not render at that size');
  }
});

$('#share').addEventListener('click', async () => {
  const url = `${location.origin}${location.pathname}#g=${encodeGraph(graph)}`;
  try {
    await navigator.clipboard.writeText(url);
    toast('link copied — it contains the whole graph');
  } catch {
    location.hash = `g=${encodeGraph(graph)}`;
    toast('link is in the address bar');
  }
});

/* ── the graph in the address bar ────────────────────────────────────────── */

/* base64 of the JSON, made URL-safe. Not compression — just something that
   survives being pasted into a chat window without a helpful client turning
   half of it into a hyperlink. */
function encodeGraph(g) {
  const json = JSON.stringify(serialize(g));
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeGraph(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ── the briefing ────────────────────────────────────────────────────────── */

const panel = explainer({
  key: 'loom',
  title: 'Loom',
  tagline: 'Build a picture by wiring boxes together.',
  sections: [
    {
      h: 'In one sentence',
      p: 'Every box makes an image; you connect them up, and the last one is the picture.',
    },
    {
      h: 'What you are looking at',
      p: [
        'The boxes in the middle are the recipe. One box makes a cloud of random fog, another bends whatever it is given, another swaps grey for colour. Each box shows a thumbnail of what it is producing at that moment, so you can see the picture being assembled one step at a time.',
        'The big square on the right is the finished result — whatever reaches the box marked <b>Output</b>.',
      ],
    },
    {
      h: 'Try this first',
      p: [
        'Press <b>Shuffle it</b> a few times. Then click any box and drag a slider — watch the thumbnails after it in the chain change while the ones before it stay exactly as they were.',
        'Then drag from the dot on the right edge of one box to the dot on the left edge of another, and you have rewired the recipe.',
      ],
    },
    {
      h: 'How it works',
      p: [
        'Boxes are worked out in dependency order: nothing is calculated until everything feeding it has been. The result of each box is remembered against a fingerprint of everything that could change it — its settings, its size, and the fingerprints of its inputs.',
        'So when you drag a slider near the end of the chain, only the boxes after it are recalculated. The expensive fog at the start is reused untouched. That is the entire reason the sliders feel attached to the picture rather than laggy.',
        'While you are actually dragging, it renders at half size and switches back to full when you let go.',
      ],
    },
    {
      h: 'The honest limits',
      p: 'Everything here runs on one processor core in plain JavaScript — no graphics card, no WebGL. That is a deliberate trade: it works everywhere, including phones and locked-down work laptops, and it is a few hundred lines rather than a few thousand. The cost is that a 2048×2048 export takes a second or two rather than being instant.',
    },
  ],
});
$('#explainSlot').append(explainButton(panel));

/* ── go ──────────────────────────────────────────────────────────────────── */

themeToggle($('#theme'));

if (location.hash.startsWith('#g=')) {
  try { graph = deserialize(decodeGraph(location.hash.slice(3))); }
  catch { /* a mangled link just falls back to the starter graph */ }
}

rebuild();
refreshPortFill();
requestAnimationFrame(() => { fitView(); });
new ResizeObserver(() => schedule({ wires: true })).observe(stage);
requestAnimationFrame(loop);
</script>

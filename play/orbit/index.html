<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" href="../../favicon.svg" />
<meta name="theme-color" content="#06070d" />
<title>Comet — how long can you last?</title>
<meta name="description" content="Move the mouse. Collect the gold. Don't touch the red. A tiny arcade game with a very short learning curve." />
<meta property="og:title" content="Comet — how long can you last?" />
<meta property="og:description" content="Move the mouse. Collect the gold. Don't touch the red. A tiny arcade game with a very short learning curve." />
<meta property="og:type" content="website" />
<style>
  :root {
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --dim: #8c98ad;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #05060b; color: #eef2f8; font-family: var(--sans); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: none; }

  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; pointer-events: none;
  }
  .top * { pointer-events: auto; }
  .pill {
    background: rgba(14,17,26,.8); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.1); border-radius: 99px; padding: 7px 13px;
    font-size: 13px; font-weight: 500; color: var(--dim); text-decoration: none;
  }
  .pill:hover { color: #fff; }
  .spacer { flex: 1; }
  .hud { font: 700 13px/1 var(--mono); color: #fff; letter-spacing: .02em; }
  .hud b { color: #ffd166; }
  .hud .best { color: var(--dim); font-weight: 500; margin-left: 10px; }
  .hud { display: flex; align-items: center; gap: 9px; }
  .hud .lv { color: #7dd3fc; }
  .hud .bar {
    display: inline-block; width: 54px; height: 4px; border-radius: 3px;
    background: rgba(255,255,255,.14); overflow: hidden; margin-left: 2px;
  }
  .hud .bar i { display: block; height: 100%; background: #ffd166; transition: width .18s; }

  .screen {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
    background: radial-gradient(60% 60% at 50% 50%, rgba(5,6,11,.55), rgba(5,6,11,.92));
    text-align: center; padding: 20px;
  }
  .screen.hide { display: none; }
  .screen h1 { font-size: clamp(34px, 7vw, 62px); margin: 0 0 10px; letter-spacing: -.04em; }
  .screen h1 em { font-style: normal; color: #ffd166; }
  .screen p { margin: 0 0 22px; color: var(--dim); font-size: 16px; line-height: 1.6; }
  .screen .big { font: 800 44px/1 var(--mono); color: #ffd166; margin-bottom: 4px; }
  .screen .sub { font: 500 13px/1 var(--mono); color: var(--dim); margin-bottom: 22px; }
  .go {
    font: 700 15px/1 var(--sans); color: #100b02; cursor: pointer;
    background: #ffd166; border: 0; border-radius: 12px; padding: 15px 26px;
    box-shadow: 0 12px 40px -12px rgba(255,209,102,.7);
  }
  .go:hover { transform: translateY(-1px); }
  .keys { margin-top: 18px; color: var(--dim); font-size: 12.5px; }
  .keys kbd { font: 600 11px/1 var(--mono); border: 1px solid rgba(255,255,255,.16); border-radius: 5px; padding: 3px 6px; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <a class="pill" href="../../index.html">← back</a>
  <div class="spacer"></div>
  <div class="pill hud" id="hud">0 <span class="best" id="best"></span></div>
</div>

<div class="screen" id="start">
  <div>
    <h1>Comet</h1>
    <p>Move your mouse to fly.<br>Collect the <em style="color:#ffd166;font-style:normal">gold</em>. Don't touch the <em style="color:#ff4d6d;font-style:normal">red</em>.<br>
    <span style="font-size:14px;opacity:.8">Fill the bar to clear a level. They keep coming.</span></p>
    <button class="go" id="go">Start</button>
    <div class="keys"><kbd>click</kbd> dash through danger &middot; <kbd>P</kbd> pause</div>
  </div>
</div>

<div class="screen hide" id="over">
  <div>
    <div class="big" id="finalScore">0</div>
    <div class="sub" id="finalNote">—</div>
    <button class="go" id="again">Again</button>
    <div class="keys">or press <kbd>space</kbd></div>
  </div>
</div>

<script type="module">
import { levelFor, clearBonus, progress, store } from './levels.js';

/* ───────────────────────────────────────────────────────────────────────────
   A very small arcade game. The rules fit in one line, so everything else
   here is feel: the ship lags behind the cursor instead of snapping to it,
   the screen shakes when you get hit, time slows for a moment when you die,
   and every pickup throws sparks. None of that changes the rules; all of it
   changes whether the game is fun.
   ─────────────────────────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

let state = 'menu';
let score = 0;
let { score: best, level: bestLevel } = store.best();
let time = 0, shake = 0, slowmo = 1, combo = 1, comboTimer = 0;

/* ── levels ──────────────────────────────────────────────────────────────────
   The curve itself lives in levels.js and is tested there. This only has to
   count orbs and move on when the quota is met. */
let level = 1, cfg = levelFor(1), collected = 0;
let banner = 0, bannerText = '';
let mouse = { x: innerWidth / 2, y: innerHeight / 2 };

const ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 9, dash: 0, cooldown: 0 };
let orbs = [], drones = [], mines = [], spinners = [], sparks = [], stars = [];

function reset() {
  score = 0; time = 0; combo = 1; comboTimer = 0; shake = 0; slowmo = 1;
  ship.x = W / 2; ship.y = H / 2; ship.vx = ship.vy = 0; ship.dash = 0; ship.cooldown = 0;
  sparks = [];
  stars = Array.from({ length: 90 }, () => ({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1) }));
  level = 1;
  enterLevel(1, false);
}

/** Lay out a level: clear the board, then place what the table asks for. */
function enterLevel(n, announce = true) {
  level = n;
  cfg = levelFor(n);
  collected = 0;
  orbs = []; drones = []; mines = []; spinners = [];
  for (let i = 0; i < 4; i++) spawnOrb();
  // one hunter to begin with; the rest arrive as you collect
  spawnDrone();
  for (let i = 0; i < cfg.mines; i++) spawnMine();
  for (let i = 0; i < cfg.spinners; i++) spawnSpinner(i);
  if (announce) {
    bannerText = `LEVEL ${n} · ${cfg.name}`;
    banner = 150;
  }
}

/* A mine is laid away from wherever the ship currently is, and fades in before
   it can hurt you. Dropping a live hazard on top of the player is the cheapest
   possible way to lose their trust. */
function spawnMine() {
  for (let attempt = 0; attempt < 40; attempt++) {
    const m = { x: rand(70, W - 70), y: rand(90, H - 90), r: 13, born: time, drift: rand(0, 6.28) };
    if (dist2(m, ship) > 210 ** 2) { mines.push(m); return; }
  }
}

/* A bar on a pivot. Readable at a glance, and the only hazard that punishes
   standing still in a corner — which is otherwise the dominant strategy. */
function spawnSpinner(i) {
  spinners.push({
    x: rand(W * 0.25, W * 0.75),
    y: rand(H * 0.3, H * 0.7),
    len: rand(90, 150),
    a: rand(0, 6.28),
    spin: (i % 2 ? -1 : 1) * rand(0.012, 0.02),
    born: time,
  });
}

function spawnOrb() {
  orbs.push({ x: rand(60, W - 60), y: rand(80, H - 80), r: 9, t: rand(0, 6.28) });
}

function spawnDrone() {
  // always arrive from an edge, never on top of the player
  const edge = (Math.random() * 4) | 0;
  const p = { x: 0, y: 0, vx: 0, vy: 0, r: 11, born: time };
  if (edge === 0) { p.x = -20; p.y = rand(0, H); }
  else if (edge === 1) { p.x = W + 20; p.y = rand(0, H); }
  else if (edge === 2) { p.x = rand(0, W); p.y = -20; }
  else { p.x = rand(0, W); p.y = H + 20; }
  drones.push(p);
}

function spark(x, y, color, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.4, 1) * power;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
  }
}

/* ── loop ───────────────────────────────────────────────────────────────── */
let last = performance.now();
function frame(now) {
  const dtRaw = Math.min(50, now - last) / 16.67;
  last = now;
  const dt = dtRaw * slowmo;
  if (state === 'play') update(dt);
  draw(dt);
  requestAnimationFrame(frame);
}

function update(dt) {
  time += dt;
  slowmo += (1 - slowmo) * 0.04 * dt;

  /* the ship chases the cursor with spring physics — the lag is the game */
  const grab = ship.dash > 0 ? 0.55 : 0.18;
  ship.vx += (mouse.x - ship.x) * grab * dt * 0.25;
  ship.vy += (mouse.y - ship.y) * grab * dt * 0.25;
  ship.vx *= 0.86; ship.vy *= 0.86;
  ship.x += ship.vx * dt; ship.y += ship.vy * dt;
  ship.dash = Math.max(0, ship.dash - dt);
  ship.cooldown = Math.max(0, ship.cooldown - dt);

  const speed = Math.hypot(ship.vx, ship.vy);
  if (speed > 2 && Math.random() < 0.6) {
    sparks.push({ x: ship.x, y: ship.y, vx: -ship.vx * 0.1, vy: -ship.vy * 0.1, life: 0.5, color: ship.dash > 0 ? '#7dd3fc' : '#ffd166' });
  }

  /* pickups */
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.t += dt * 0.06;
    if (dist2(o, ship) < (o.r + ship.r + 6) ** 2) {
      orbs.splice(i, 1);
      score += 10 * combo;
      combo = Math.min(9, combo + 1);
      comboTimer = 110;
      shake = Math.min(14, shake + 4);
      spark(o.x, o.y, '#ffd166', 20, 5);
      collected++;
      if (collected >= cfg.quota) { levelUp(); return; }
      spawnOrb();
      // hunters arrive as you collect, up to this level's allowance
      if (drones.length < cfg.drones && Math.random() < 0.7) spawnDrone();
    }
  }

  comboTimer -= dt;
  if (comboTimer <= 0 && combo > 1) { combo = 1; comboTimer = 0; }

  /* hunters — how hard they steer and how fast they go is the level's job now,
     not a function of how long you have survived. A run is a sequence of
     levels, so the difficulty has to belong to the level or clearing one would
     mean nothing. */
  const chase = cfg.chase;
  for (const d of drones) {
    const dx = ship.x - d.x, dy = ship.y - d.y;
    const len = Math.hypot(dx, dy) || 1;
    d.vx += (dx / len) * chase * dt;
    d.vy += (dy / len) * chase * dt;
    const s = Math.hypot(d.vx, d.vy);
    const cap = cfg.speed;
    if (s > cap) { d.vx = d.vx / s * cap; d.vy = d.vy / s * cap; }
    d.x += d.vx * dt; d.y += d.vy * dt;

    if (time - d.born > 40 && dist2(d, ship) < (d.r + ship.r) ** 2) {
      if (ship.dash > 0) {                       // dashing destroys it instead
        d.dead = true;
        score += 25;
        spark(d.x, d.y, '#ff4d6d', 26, 6);
        shake = 12;
      } else die();
    }
  }
  drones = drones.filter((d) => !d.dead);

  /* mines: inert while they fade in, then fatal. No dash gets you through one,
     which is what makes them different from a hunter rather than more of one. */
  for (const m of mines) {
    m.drift += dt * 0.01;
    m.x += Math.cos(m.drift) * 0.18 * dt;
    m.y += Math.sin(m.drift * 0.8) * 0.18 * dt;
    m.x = Math.max(24, Math.min(W - 24, m.x));
    m.y = Math.max(24, Math.min(H - 24, m.y));
    if (time - m.born > 60 && dist2(m, ship) < (m.r + ship.r) ** 2) die();
  }

  /* spinners: a bar on a pivot, tested against as a line segment rather than
     as a series of blobs, or the ship slips through between samples */
  for (const sp of spinners) {
    sp.a += sp.spin * dt;
    if (time - sp.born < 60) continue;
    const ex = sp.x + Math.cos(sp.a) * sp.len, ey = sp.y + Math.sin(sp.a) * sp.len;
    const ex2 = sp.x - Math.cos(sp.a) * sp.len, ey2 = sp.y - Math.sin(sp.a) * sp.len;
    if (segmentHit(ex2, ey2, ex, ey, ship.x, ship.y, ship.r + 5)) die();
  }

  for (const s of sparks) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= 0.94; s.vy *= 0.94;
    s.life -= 0.022 * dt;
  }
  sparks = sparks.filter((s) => s.life > 0);

  shake *= 0.88;
  if (time > 300 && drones.length < Math.min(2, cfg.drones)) spawnDrone();
}

/** Distance from a point to a line segment, squared against a radius. */
function segmentHit(x1, y1, x2, y2, px, py, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = x1 + dx * t, cy = y1 + dy * t;
  return (px - cx) ** 2 + (py - cy) ** 2 < r * r;
}

function levelUp() {
  score += clearBonus(level);
  shake = 16;
  spark(ship.x, ship.y, '#7dd3fc', 40, 7);
  for (const d of drones) spark(d.x, d.y, '#ff4d6d', 10, 4);
  // a clean board for a second, so the new level does not open with a hunter
  // already on top of you
  enterLevel(level + 1);
}

function die() {
  state = 'over';
  slowmo = 0.18;
  shake = 26;
  spark(ship.x, ship.y, '#ff4d6d', 60, 9);
  spark(ship.x, ship.y, '#ffd166', 30, 6);
  const fresh = store.record(score, level);
  best = Math.max(best, score);
  bestLevel = Math.max(bestLevel, level);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalNote').innerHTML = fresh.score
    ? `NEW BEST &middot; reached level ${level}`
    : `level ${level} &middot; best ${best} (level ${bestLevel})`;
  setTimeout(() => document.getElementById('over').classList.remove('hide'), 700);
}

/* ── draw ───────────────────────────────────────────────────────────────── */
function draw(dt) {
  ctx.save();
  if (shake > 0.4) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

  ctx.fillStyle = '#05060b';
  ctx.fillRect(-40, -40, W + 80, H + 80);

  for (const s of stars) {
    ctx.globalAlpha = 0.18 + s.z * 0.5;
    ctx.fillStyle = '#9fb3d1';
    ctx.fillRect(s.x, s.y, s.z * 1.8, s.z * 1.8);
  }
  ctx.globalAlpha = 1;

  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.fillStyle = s.color;
    const r = 2.6 * s.life + 0.6;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const o of orbs) {
    const pulse = 1 + Math.sin(o.t) * 0.16;
    glow(o.x, o.y, o.r * 3.2 * pulse, 'rgba(255,209,102,0.25)');
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * pulse, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * pulse + 4, 0, 6.2832); ctx.stroke();
  }

  /* spinners first, so a hunter crossing one still reads on top */
  for (const sp of spinners) {
    const arming = time - sp.born < 60;
    const ex = Math.cos(sp.a) * sp.len, ey = Math.sin(sp.a) * sp.len;
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.globalAlpha = arming ? 0.28 : 1;
    ctx.strokeStyle = arming ? 'rgba(255,77,109,.5)' : '#ff4d6d';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-ex, -ey); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0b0d16';
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }

  for (const m of mines) {
    const arming = time - m.born < 60;
    const t = Math.min(1, (time - m.born) / 60);
    glow(m.x, m.y, m.r * 2.6, `rgba(255,77,109,${arming ? 0.08 : 0.22})`);
    ctx.globalAlpha = arming ? 0.35 + t * 0.4 : 1;
    ctx.fillStyle = '#c9304c';
    ctx.beginPath();
    // a spiked disc, so it is obviously not a thing you collect
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * 6.2832 + time * 0.004;
      const r = i % 2 ? m.r * 0.62 : m.r * 1.18;
      ctx.lineTo(m.x + Math.cos(a) * r, m.y + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0b0d16';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 0.38, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  for (const d of drones) {
    const warn = time - d.born < 40;
    glow(d.x, d.y, d.r * 3, warn ? 'rgba(255,77,109,.12)' : 'rgba(255,77,109,.3)');
    ctx.fillStyle = warn ? 'rgba(255,77,109,.45)' : '#ff4d6d';
    ctx.beginPath();
    const a = Math.atan2(d.vy, d.vx);
    ctx.moveTo(d.x + Math.cos(a) * d.r * 1.5, d.y + Math.sin(a) * d.r * 1.5);
    ctx.lineTo(d.x + Math.cos(a + 2.4) * d.r, d.y + Math.sin(a + 2.4) * d.r);
    ctx.lineTo(d.x + Math.cos(a - 2.4) * d.r, d.y + Math.sin(a - 2.4) * d.r);
    ctx.closePath(); ctx.fill();
  }

  if (state === 'play' || state === 'over') {
    const dashing = ship.dash > 0;
    glow(ship.x, ship.y, 34, dashing ? 'rgba(125,211,252,.35)' : 'rgba(255,209,102,.22)');
    ctx.fillStyle = dashing ? '#7dd3fc' : '#fff';
    ctx.beginPath(); ctx.arc(ship.x, ship.y, ship.r, 0, 6.2832); ctx.fill();
    if (ship.cooldown > 0 && !dashing) {
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(ship.x, ship.y, ship.r + 6, -1.57, -1.57 + (1 - ship.cooldown / 90) * 6.2832);
      ctx.stroke();
    }
  }

  ctx.restore();

  // the level banner sits above everything, including the shake
  if (banner > 0) {
    banner -= dt;
    const t = Math.min(1, banner / 150);
    ctx.globalAlpha = Math.min(1, t * 3) * Math.min(1, (1 - t) * 6 + 0.35);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7dd3fc';
    ctx.font = '800 34px "Inter", ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(bannerText, W / 2, H * 0.42);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  if (state === 'play') {
    const pct = Math.round(progress(collected, cfg.quota) * 100);
    document.getElementById('hud').innerHTML =
      `<span class="lv">L${level}</span> ${score}` +
      `${combo > 1 ? ` <b>x${combo}</b>` : ''}` +
      `<span class="bar"><i style="width:${pct}%"></i></span>` +
      `<span class="best">${collected}/${cfg.quota}</span>`;
  }
}

function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}

/* ── input ──────────────────────────────────────────────────────────────── */
addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('pointerdown', (e) => {
  if (state !== 'play') return;
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (ship.cooldown <= 0) { ship.dash = 16; ship.cooldown = 90; spark(ship.x, ship.y, '#7dd3fc', 16, 5); }
});
addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); if (state === 'over') startGame(); }
  if (e.key === 'p' && state === 'play') state = 'paused';
  else if (e.key === 'p' && state === 'paused') state = 'play';
});

function startGame() {
  reset();
  document.getElementById('start').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  state = 'play';
}
document.getElementById('go').onclick = startGame;
document.getElementById('again').onclick = startGame;
document.getElementById('best').textContent = best ? `best ${best} · level ${bestLevel}` : '';

reset();
state = 'menu';
requestAnimationFrame(frame);
</script>
<script type="module" src="../../shared/navigator.js"></script>
</body>
</html>

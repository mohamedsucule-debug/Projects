<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Flow — paint with twenty thousand particles</title>
<meta name="description" content="Twenty thousand particles riding an invisible current. Move your mouse to push them around, then save the result as a picture." />
<style>
  :root {
    --panel: rgba(14, 16, 24, .78);
    --line: rgba(255,255,255,.11);
    --fg: #f2f5fa;
    --dim: #9aa6bb;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #05060a; color: var(--fg); font-family: var(--sans); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: none; }

  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; pointer-events: none;
  }
  .top * { pointer-events: auto; }
  .pill {
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 99px; padding: 7px 13px;
    font-size: 13px; font-weight: 500; color: var(--dim); text-decoration: none;
  }
  .pill:hover { color: var(--fg); }
  .title { font-size: 14px; font-weight: 700; }
  .title span { color: var(--dim); font-weight: 400; margin-left: 7px; }
  .spacer { flex: 1; }

  .dock {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
    background: var(--panel); backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 16px; padding: 11px 14px;
    max-width: calc(100vw - 20px);
    box-shadow: 0 20px 50px -22px #000;
  }
  .swatches { display: flex; gap: 7px; }
  .sw {
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
    border: 2px solid transparent; padding: 0;
    transition: transform .12s;
  }
  .sw:hover { transform: translateY(-2px) scale(1.06); }
  .sw.on { border-color: #fff; }
  .ctl { display: flex; flex-direction: column; gap: 4px; }
  .ctl label { font: 600 9px/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 92px; height: 14px; background: transparent; cursor: ew-resize; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%; background: #fff; }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); }
  input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 0; }
  .btn {
    font: 600 12.5px/1 var(--sans); color: var(--dim); cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  .btn:hover { color: var(--fg); background: rgba(255,255,255,.12); }

  .hint {
    position: fixed; left: 0; right: 0; top: 46%; text-align: center; z-index: 5;
    pointer-events: none; transition: opacity .6s;
  }
  .hint h2 { margin: 0 0 8px; font-size: clamp(26px, 5.5vw, 46px); letter-spacing: -.035em; text-shadow: 0 4px 40px #000; }
  .hint p { margin: 0; color: var(--dim); font-size: 15px; text-shadow: 0 2px 20px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <a class="pill" href="../../index.html">← back</a>
  <div class="title">Flow<span id="sub">move your mouse</span></div>
  <div class="spacer"></div>
  <div class="pill" id="count">—</div>
</div>

<div class="hint" id="hint">
  <h2>Move your mouse.</h2>
  <p>Twenty thousand particles are riding an invisible current. Click to stir it.</p>
</div>

<div class="dock">
  <div class="swatches" id="swatches"></div>
  <div class="ctl"><label>trails</label><input id="trail" type="range" min="1" max="60" value="5" /></div>
  <div class="ctl"><label>speed</label><input id="speed" type="range" min="10" max="220" value="100" /></div>
  <div class="ctl"><label>swirl</label><input id="swirl" type="range" min="0" max="100" value="45" /></div>
  <button class="btn" id="shuffle">↻ new current</button>
  <button class="btn" id="save">↓ save picture</button>
</div>

<script>
/* ───────────────────────────────────────────────────────────────────────────
   Twenty thousand particles, each one obeying the same rule: look up the
   direction of the invisible field underneath you, and drift that way. The
   field is smooth noise that rotates slowly over time, so the whole thing
   breathes. The pictures come from the particles' trails, not from any
   drawing code.
   ─────────────────────────────────────────────────────────────────────────── */

const PALETTES = [
  { name: 'aurora', chip: 'linear-gradient(140deg,#22d3ee,#818cf8,#f472b6)', stops: [[34,211,238],[129,140,248],[244,114,182]] },
  { name: 'ember',  chip: 'linear-gradient(140deg,#fbbf24,#f97316,#dc2626)', stops: [[251,191,36],[249,115,22],[220,38,38]] },
  { name: 'lagoon', chip: 'linear-gradient(140deg,#a7f3d0,#2dd4bf,#0ea5e9)', stops: [[167,243,208],[45,212,191],[14,165,233]] },
  { name: 'candy',  chip: 'linear-gradient(140deg,#fecdd3,#f0abfc,#a78bfa)', stops: [[254,205,211],[240,171,252],[167,139,250]] },
  { name: 'ink',    chip: 'linear-gradient(140deg,#f8fafc,#94a3b8,#334155)', stops: [[248,250,252],[148,163,184],[51,65,85]] },
];

const N = 20000;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, dpr = 1;
const px = new Float32Array(N), py = new Float32Array(N);
const vx = new Float32Array(N), vy = new Float32Array(N);
const age = new Float32Array(N), hue = new Float32Array(N);

let palette = PALETTES[0];
let trail = 0.05, speed = 1.0, swirl = 0.45, seed = Math.random() * 1000;
let mx = -999, my = -999, pushing = false, moved = false;

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = canvas.width = Math.floor(innerWidth * dpr);
  H = canvas.height = Math.floor(innerHeight * dpr);
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);
}

function spawn(i, anywhere = true) {
  px[i] = anywhere ? Math.random() * W : mx + (Math.random() - 0.5) * 120 * dpr;
  py[i] = anywhere ? Math.random() * H : my + (Math.random() - 0.5) * 120 * dpr;
  vx[i] = vy[i] = 0;
  age[i] = Math.random() * 260;
  hue[i] = Math.random();
}
for (let i = 0; i < N; i++) spawn(i);

/* ── the field ────────────────────────────────────────────────────────────
   Cheap smooth noise: hash the grid corners, then blend between them. Good
   enough to look organic, fast enough to call twenty thousand times a frame.
──────────────────────────────────────────────────────────────────────────── */
function hash(x, y) {
  let h = x * 374761393 + y * 668265263 + seed * 1013904223;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) & 0xffff) / 0xffff;
}
const smooth = (t) => t * t * (3 - 2 * t);

function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = smooth(x - xi), yf = smooth(y - yi);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return (a + (b - a) * xf) + ((c + (d - c) * xf) - (a + (b - a) * xf)) * yf;
}

let t = 0;
function fieldAngle(x, y) {
  const s = 0.0016 / dpr;
  return noise(x * s, y * s + t) * Math.PI * 4;
}

const mixColor = (u) => {
  const s = palette.stops;
  const f = u * (s.length - 1);
  const i = Math.min(s.length - 2, Math.floor(f));
  const k = f - i;
  return [
    (s[i][0] + (s[i + 1][0] - s[i][0]) * k) | 0,
    (s[i][1] + (s[i + 1][1] - s[i][1]) * k) | 0,
    (s[i][2] + (s[i + 1][2] - s[i][2]) * k) | 0,
  ];
};

function frame() {
  // fade the previous frame instead of clearing it — that is what leaves trails
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(5, 6, 10, ${trail})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  t += 0.0012;

  const pr = 150 * dpr;                       // pointer radius
  for (let i = 0; i < N; i++) {
    const a = fieldAngle(px[i], py[i]);
    vx[i] += Math.cos(a) * 0.28 * swirl;
    vy[i] += Math.sin(a) * 0.28 * swirl;

    if (mx > -900) {                          // the pointer pushes them around
      const dx = px[i] - mx, dy = py[i] - my;
      const d2 = dx * dx + dy * dy;
      if (d2 < pr * pr) {
        const d = Math.sqrt(d2) || 1;
        const f = (1 - d / pr) * (pushing ? 3.2 : 1.1);
        vx[i] += (dx / d) * f;
        vy[i] += (dy / d) * f;
      }
    }

    vx[i] *= 0.94; vy[i] *= 0.94;
    const ox = px[i], oy = py[i];
    px[i] += vx[i] * speed;
    py[i] += vy[i] * speed;

    // additive blending stacks up to white wherever particles crowd, so keep
    // each stroke faint and let the colour build instead of blowing out
    const [r, g, b] = mixColor(hue[i]);
    ctx.strokeStyle = `rgba(${r},${g},${b},0.16)`;
    ctx.lineWidth = dpr * 1.15;
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(px[i], py[i]);
    ctx.stroke();

    if (--age[i] < 0 || px[i] < 0 || px[i] > W || py[i] < 0 || py[i] > H) spawn(i);
  }
  requestAnimationFrame(frame);
}

/* ── input ──────────────────────────────────────────────────────────────── */
function point(e) {
  mx = e.clientX * dpr;
  my = e.clientY * dpr;
  if (!moved) {
    moved = true;
    document.getElementById('hint').style.opacity = 0;
  }
}
addEventListener('pointermove', point);
addEventListener('pointerdown', (e) => { pushing = true; point(e); burst(); });
addEventListener('pointerup', () => { pushing = false; });
addEventListener('pointerleave', () => { mx = my = -999; });

function burst() {
  for (let k = 0; k < 1200; k++) {
    const i = (Math.random() * N) | 0;
    const a = Math.random() * Math.PI * 2, r = Math.random() * 40 * dpr;
    px[i] = mx + Math.cos(a) * r;
    py[i] = my + Math.sin(a) * r;
    vx[i] = Math.cos(a) * 6;
    vy[i] = Math.sin(a) * 6;
    age[i] = 120 + Math.random() * 200;
  }
}

/* ── chrome ─────────────────────────────────────────────────────────────── */
const sw = document.getElementById('swatches');
PALETTES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i === 0 ? ' on' : '');
  b.style.background = p.chip;
  b.title = p.name;
  b.onclick = () => {
    palette = p;
    [...sw.children].forEach((c) => c.classList.toggle('on', c === b));
    document.getElementById('sub').textContent = p.name;
  };
  sw.append(b);
});

document.getElementById('trail').oninput = (e) => { trail = (+e.target.value) / 100; };
document.getElementById('speed').oninput = (e) => { speed = (+e.target.value) / 100; };
document.getElementById('swirl').oninput = (e) => { swirl = (+e.target.value) / 100; };
document.getElementById('shuffle').onclick = () => {
  seed = Math.random() * 1000;
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);
};
document.getElementById('save').onclick = () => {
  const a = document.createElement('a');
  a.download = `flow-${Date.now()}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
};

document.getElementById('count').textContent = (N / 1000) + 'k particles';
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 8000);

addEventListener('resize', resize);
resize();
frame();
</script>
</body>
</html>
